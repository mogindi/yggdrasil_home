# Yggdrasil Home pipeline. Security scanning is maintained in the
# yggdrasil_security repository so ISO evidence and scanner logic have one
# controlled home. Configure YGGDRASIL_SECURITY_REPO_URL as a secured pipeline
# variable before enabling this pipeline.

image: atlassian/default-image:3

pipelines:
  default:
    - parallel:
      - step:
          name: 'Shell validation'
          script:
            - git diff --check
            - git ls-files '*.sh' | xargs -r -n1 bash -n
      - step:
          name: 'Repository validation'
          script:
            - test -f README.md
            - test -f Makefile
      - step:
          name: 'ISO security baseline'
          script:
            - test -n "$YGGDRASIL_SECURITY_REPO_URL"
            - git clone --depth 1 --branch "${YGGDRASIL_SECURITY_REF:-main}" "$YGGDRASIL_SECURITY_REPO_URL" .yggdrasil_security
            - .yggdrasil_security/scripts/scan-repository.sh --repo "$BITBUCKET_CLONE_DIR" --enforce

    # Deployment commands must be added only after their credentials, approvals,
    # rollback, and evidence requirements are defined.
    - step:
        name: 'Deployment to Staging'
        deployment: staging
        script:
          - echo "Staging deployment is intentionally not enabled in this baseline pipeline."
    - step:
        name: 'Deployment to Production'
        deployment: production
        trigger: 'manual'
        script:
          - echo "Production deployment requires an approved release workflow."
