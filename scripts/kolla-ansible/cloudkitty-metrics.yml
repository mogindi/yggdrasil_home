metrics:
  # Ceilometer's instance uptime gauge is vcpus.  Keep the CloudKitty
  # service name as instance because the hashmap is keyed by flavor_id.
  vcpus:
    unit: instance
    alt_name: instance
    groupby:
      - id
      - user_id
      - project_id
    metadata:
      - flavor_name
      - flavor_id
      - vcpus
    mutate: NUMBOOL
    extra_args:
      aggregation_method: mean
      resource_type: instance
      force_granularity: 600

  image.size:
    unit: GiB
    factor: 1/1073741824
    groupby:
      - id
      - user_id
      - project_id
    metadata:
      - container_format
      - disk_format
    extra_args:
      aggregation_method: mean
      resource_type: image
      force_granularity: 600

  volume.size:
    unit: GiB
    groupby:
      - id
      - user_id
      - project_id
    metadata:
      - volume_type
    extra_args:
      aggregation_method: mean
      resource_type: volume
      force_granularity: 600

  # Gnocchi stores the cumulative bytes metrics.  Calculate their rate at
  # collection time and expose the customer-facing hourly service names.
  network.outgoing.bytes:
    unit: MB
    alt_name: network.outgoing.bytes.rate
    groupby:
      - id
      - project_id
      - user_id
    factor: 3600/1000000
    metadata:
      - instance_id
    extra_args:
      aggregation_method: rate:mean
      re_aggregation_method: mean
      resource_type: instance_network_interface
      force_granularity: 600

  network.incoming.bytes:
    unit: MB
    alt_name: network.incoming.bytes.rate
    groupby:
      - id
      - project_id
      - user_id
    factor: 3600/1000000
    metadata:
      - instance_id
    extra_args:
      aggregation_method: rate:mean
      re_aggregation_method: mean
      resource_type: instance_network_interface
      force_granularity: 600

  ip.floating:
    unit: ip
    groupby:
      - id
      - user_id
      - project_id
    metadata:
      - state
    mutate: NUMBOOL
    extra_args:
      aggregation_method: mean
      resource_type: network
      force_granularity: 600

  radosgw.objects.size:
    unit: GiB
    groupby:
      - id
      - user_id
      - project_id
    factor: 1/1073741824
    extra_args:
      aggregation_method: mean
      resource_type: ceph_account
      force_granularity: 600

  manila.share.size:
    unit: GiB
    groupby:
      - id
      - user_id
      - project_id
    metadata:
      - name
      - protocol
      - availability_zone
      - status
    extra_args:
      aggregation_method: mean
      resource_type: manila_share
      force_granularity: 600

  # The current Cinder pollster publishes volume.backup.size. Keep the
  # resource metric in the CloudKitty definition so newly collected backups
  # are rated.
  volume.backup.size:
    unit: GiB
    groupby:
      - id
      - user_id
      - project_id
    extra_args:
      aggregation_method: mean
      resource_type: volume
      force_granularity: 600

  # Older Ceilometer/Cinder deployments published backup capacity as
  # backup.size. Keep the legacy source mapped to the same customer service
  # name so existing measures remain billable during migration.
  backup.size:
    unit: GiB
    alt_name: volume.backup.size
    groupby:
      - id
      - user_id
      - project_id
    extra_args:
      aggregation_method: mean
      resource_type: volume
      force_granularity: 600

  volume.snapshot.size:
    unit: GiB
    groupby:
      - id
      - project_id
    metadata:
      - name
      - status
    extra_args:
      aggregation_method: mean
      resource_type: yggdrasil_volume_snapshot
      force_granularity: 600

  octavia.loadbalancer:
    unit: loadbalancer
    groupby:
      - id
      - project_id
    metadata:
      - name
      - status
    extra_args:
      aggregation_method: mean
      resource_type: yggdrasil_loadbalancer
      force_granularity: 600
