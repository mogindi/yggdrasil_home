---
- name: Harden nodes
  hosts: deployment_nodes
  any_errors_fatal: true
  vars:
    clamav_version: '1.4.1'
    clamav_package_version: '1.4.1-1'
    clamav_package_url: >-
      https://www.clamav.net/downloads/production/clamav-{{ clamav_version }}.linux.x86_64.deb
    clamav_package_path: >-
      /var/cache/clamav-{{ clamav_version }}.linux.x86_64.deb
    security_services:
      - name: security_auditd.service
        script: auditd.sh
        after: apt-daily.service apt-daily-upgrade.service
      - name: security_clamav.service
        script: clamav.sh
        after: security_auditd.service
      - name: security_disable_password_ssh.service
        script: disable_password_ssh.sh
        after: security_clamav.service
      - name: security_fail2ban.service
        script: fail2ban.sh
        after: security_disable_password_ssh.service
      - name: security_iptables.service
        script: iptables.sh
        after: security_fail2ban.service
      - name: security_oscap.service
        script: oscap.sh
        after: security_iptables.service
      - name: security_sysdig.service
        script: sysdig.sh
        after: security_oscap.service
  tasks:
    - name: Install apt packages
      apt:
        name:
          - auditd
          - curl
          - lsb-release
          - openscap-scanner
          - bzip2
          - fail2ban
          - clamav
          - clamav-daemon
          - wget
        state: present
        update_cache: yes

    - name: Correct any apt package issues
      command: dpkg --configure -a

    - name: Check installed ClamAV package version
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - -f=${Version}
          - clamav
      register: clamav_installed_version
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Download pinned ClamAV package
      ansible.builtin.get_url:
        url: "{{ clamav_package_url }}"
        dest: "{{ clamav_package_path }}"
        mode: '0644'
        timeout: 120
      when:
        - clamav_installed_version.rc != 0 or clamav_installed_version.stdout != clamav_package_version
        - not ansible_check_mode

    - name: Install pinned ClamAV package
      ansible.builtin.apt:
        deb: "{{ clamav_package_path }}"
        state: present
      when:
        - clamav_installed_version.rc != 0 or clamav_installed_version.stdout != clamav_package_version
        - not ansible_check_mode

    - name: Check whether Sysdig is installed
      ansible.builtin.shell: command -v sysdig
      args:
        executable: /bin/bash
      register: sysdig_installed
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Install Sysdig when absent
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://s3.amazonaws.com/download.draios.com/stable/install-sysdig | bash
      args:
        executable: /bin/bash
      when:
        - sysdig_installed.rc != 0
        - not ansible_check_mode

    - name: Verify Sysdig installation
      ansible.builtin.shell: command -v sysdig
      args:
        executable: /bin/bash
      changed_when: false
      when: not ansible_check_mode

    - name: Copy hardening folder
      copy:
        src: "{{ playbook_dir }}/../scripts/hardening"
        dest: /opt/
        mode: preserve
      tags: copy_only
      register: copy_hardening

    - name: Create Yggdrasil configuration directory
      ansible.builtin.file:
        path: /etc/yggdrasil
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Install additional iptables rules
      ansible.builtin.template:
        src: additional_iptables_rules.j2
        dest: /etc/yggdrasil/additional-iptables.rules
        owner: root
        group: root
        mode: '0644'
      register: additional_iptables_rules_file

    - name: Remove legacy rc.local file
      ansible.builtin.file:
        path: /etc/rc.local
        state: absent

    - name: Stop and disable legacy rc-local service
      ansible.builtin.systemd:
        name: rc-local.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Install security systemd service units
      ansible.builtin.template:
        src: security_hardening.service.j2
        dest: "/etc/systemd/system/{{ item.name }}"
        mode: '0644'
      loop: "{{ security_services }}"
      register: security_units

    - name: Reload systemd after installing security units
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable security services
      ansible.builtin.systemd:
        name: "{{ item.name }}"
        enabled: true
      loop: "{{ security_services }}"
      when: not ansible_check_mode

    # Run as a shell command because the vulnerability scan can make the D-Bus
    # connection used by the systemd module reset while the service is running.
    - name: Run security services
      ansible.builtin.shell: |
        set -e
        {% for service in security_services %}
        systemctl restart {{ service.name }}
        {% endfor %}
      async: 1800  # 30 minutes
      poll: 0
      register: start_security_services
      when:
        - security_units.changed or copy_hardening.changed or additional_iptables_rules_file.changed
        - not ansible_check_mode

    - name: Wait until security services run is complete
      ansible.builtin.async_status:
        jid: "{{ start_security_services.ansible_job_id }}"
      register: security_services_status
      until: security_services_status.finished | bool
      retries: 180
      delay: 10
      when:
        - security_units.changed or copy_hardening.changed or additional_iptables_rules_file.changed
        - not ansible_check_mode

    - name: Ensure security services completed successfully
      ansible.builtin.assert:
        that:
          - security_services_status.rc == 0
      when:
        - security_units.changed or copy_hardening.changed or additional_iptables_rules_file.changed
        - not ansible_check_mode

    - name: Clean up async file
      ansible.builtin.async_status:
        jid: "{{ start_security_services.ansible_job_id }}"
        mode: cleanup
      when:
        - security_units.changed or copy_hardening.changed or additional_iptables_rules_file.changed
        - not ansible_check_mode
