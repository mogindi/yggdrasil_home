---
- name: Set up devices
  hosts: deployment_nodes
  gather_facts: false
  tasks:

    - name: Set image version based on openstack_release
      set_fact:
        image_version: "{{ openstack_release }}-ubuntu-{% if (openstack_release|string) == '2025.2' %}noble{% else %}jammy{% endif %}"

    - name: Build Freezer control-plane images
      shell: |
        set -euo pipefail
        docker pull quay.io/openstack.kolla/openstack-base:{{ image_version }}
        docker build --network host \
          --build-arg BASE_IMAGE=quay.io/openstack.kolla/openstack-base:{{ image_version }} \
          --build-arg FREEZER_VERSION=17.0.0 \
          --build-arg FREEZER_PIP_INDEX_URL="${FREEZER_PIP_INDEX_URL:-https://pypi.org/simple}" \
          --build-arg FREEZER_PIP_EXTRA_INDEX_URL="${FREEZER_PIP_EXTRA_INDEX_URL:-}" \
          --tag freezer-base:{{ image_version }} \
          --file {{ playbook_dir }}/../scripts/kolla-ansible/freezer-images/Dockerfile.base \
          {{ playbook_dir }}/../scripts/kolla-ansible/freezer-images
        docker build --network host \
          --build-arg FREEZER_IMAGE_TAG={{ image_version }} \
          --build-arg FREEZER_VERSION=17.0.0 \
          --build-arg FREEZER_PIP_INDEX_URL="${FREEZER_PIP_INDEX_URL:-https://pypi.org/simple}" \
          --build-arg FREEZER_PIP_EXTRA_INDEX_URL="${FREEZER_PIP_EXTRA_INDEX_URL:-}" \
          --tag quay.io/openstack.kolla/freezer-api:{{ image_version }} \
          --file {{ playbook_dir }}/../scripts/kolla-ansible/freezer-images/Dockerfile.api \
          {{ playbook_dir }}/../scripts/kolla-ansible/freezer-images
        docker build --network host \
          --build-arg FREEZER_IMAGE_TAG={{ image_version }} \
          --tag quay.io/openstack.kolla/freezer-scheduler:{{ image_version }} \
          --file {{ playbook_dir }}/../scripts/kolla-ansible/freezer-images/Dockerfile.scheduler \
          {{ playbook_dir }}/../scripts/kolla-ansible/freezer-images
        docker build --network host \
          --build-arg BASE_IMAGE=quay.io/openstack.kolla/openstack-base:{{ image_version }} \
          --build-arg ZAQAR_REF="${ZAQAR_REF:-stable/2025.2}" \
          --build-arg ZAQAR_PIP_INDEX_URL="${ZAQAR_PIP_INDEX_URL:-https://pypi.org/simple}" \
          --build-arg ZAQAR_PIP_EXTRA_INDEX_URL="${ZAQAR_PIP_EXTRA_INDEX_URL:-}" \
          --tag quay.io/openstack.kolla/zaqar:{{ image_version }} \
          --file {{ playbook_dir }}/../scripts/kolla-ansible/zaqar-images/Dockerfile \
          {{ playbook_dir }}/../scripts/kolla-ansible/zaqar-images
      args:
        executable: /bin/bash
      when: (openstack_release|string) == '2025.2'

    - name: Set images fact
      set_fact:
        images:
          - image: quay.io/openstack.kolla/nova-novncproxy:{{ image_version }}
            custom_cmds: |
              sed -i '123i\ \ \ \ \ \ \ \ expected_protos.append(\"https\")' /var/lib/kolla/venv/lib/python3.10/site-packages/nova/console/websocketproxy.py
          - image: quay.io/openstack.kolla/zun-compute:{{ image_version }}
            customize_marker: customize-zun-compute-cpu-stats-v1.done
            custom_files:
              - src: scripts/kolla-ansible/patch-zun-cpu-stats.py
                dest: /tmp/patch-zun-cpu-stats.py
            custom_cmds: |
              /var/lib/kolla/venv/bin/python /tmp/patch-zun-cpu-stats.py
          - image: quay.io/openstack.kolla/zun-wsproxy:{{ image_version }}
            customize_marker: customize-zun-wsproxy-mtls-v1.done
            custom_files:
              - src: scripts/kolla-ansible/patch-zun-wsproxy-mtls.py
                dest: /tmp/patch-zun-wsproxy-mtls.py
            custom_cmds: |
              /var/lib/kolla/venv/bin/python /tmp/patch-zun-wsproxy-mtls.py
          - image: quay.io/openstack.kolla/horizon:{{ image_version }}
            custom_cmds: |
              apt update
              apt-get -y install python3-dev default-libmysqlclient-dev build-essential pkg-config
              . /var/lib/kolla/venv/bin/activate
              pip install mysqlclient
          - image: quay.io/openstack.kolla/cloudkitty-processor:{{ image_version }}
            custom_files:
              - src: scripts/kolla-ansible/cloudkitty-metrics.yml
                dest: /tmp/cloudkitty-metrics.yml
            custom_cmds: |
              cp /tmp/cloudkitty-metrics.yml /etc/cloudkitty/metrics.yml
          - image: quay.io/openstack.kolla/magnum-api:{{ image_version }}
            custom_cmds: |
              pip uninstall -y magnum-cluster-api
          - image: quay.io/openstack.kolla/magnum-conductor:{{ image_version }}
            custom_cmds: |
              sed -i 's/\[Service\]/StartLimitIntervalSec=500\nStartLimitBurst=5\n[Service]\nRestart=on-failure\nRestartSec=5s/g' \
              /var/lib/kolla/venv/lib/python3.10/site-packages/magnum/drivers/common/templates/kubernetes/fragments/configure-etcd.sh
              pip uninstall -y magnum-cluster-api
          - image: quay.io/openstack.kolla/trove-api:{{ image_version }}
            customize_marker: customize-trove-mongodb-topology-v8.done
            custom_files:
              - src: scripts/openstack/trove-mongodb/controller/__init__.py
                dest: /tmp/trove-mongodb-controller-init.py
              - src: scripts/openstack/trove-mongodb/controller/api.py
                dest: /tmp/trove-mongodb-controller-api.py
              - src: scripts/openstack/trove-mongodb/controller/guestagent.py
                dest: /tmp/trove-mongodb-controller-guestagent.py
              - src: scripts/openstack/trove-mongodb/controller/taskmanager.py
                dest: /tmp/trove-mongodb-controller-taskmanager.py
            custom_cmds: |
              trove_site=\$(find /var/lib/kolla/venv/lib -maxdepth 2 -type d -name site-packages -print -quit)
              install -d \$trove_site/trove_yggdrasil_mongodb
              cp /tmp/trove-mongodb-controller-init.py \$trove_site/trove_yggdrasil_mongodb/__init__.py
              cp /tmp/trove-mongodb-controller-api.py \$trove_site/trove_yggdrasil_mongodb/api.py
              cp /tmp/trove-mongodb-controller-guestagent.py \$trove_site/trove_yggdrasil_mongodb/guestagent.py
              cp /tmp/trove-mongodb-controller-taskmanager.py \$trove_site/trove_yggdrasil_mongodb/taskmanager.py
          - image: quay.io/openstack.kolla/trove-taskmanager:{{ image_version }}
            customize_marker: customize-trove-mongodb-topology-v8.done
            custom_files:
              - src: scripts/openstack/trove-mongodb/controller/__init__.py
                dest: /tmp/trove-mongodb-controller-init.py
              - src: scripts/openstack/trove-mongodb/controller/api.py
                dest: /tmp/trove-mongodb-controller-api.py
              - src: scripts/openstack/trove-mongodb/controller/guestagent.py
                dest: /tmp/trove-mongodb-controller-guestagent.py
              - src: scripts/openstack/trove-mongodb/controller/taskmanager.py
                dest: /tmp/trove-mongodb-controller-taskmanager.py
            custom_cmds: |
              trove_site=\$(find /var/lib/kolla/venv/lib -maxdepth 2 -type d -name site-packages -print -quit)
              install -d \$trove_site/trove_yggdrasil_mongodb
              cp /tmp/trove-mongodb-controller-init.py \$trove_site/trove_yggdrasil_mongodb/__init__.py
              cp /tmp/trove-mongodb-controller-api.py \$trove_site/trove_yggdrasil_mongodb/api.py
              cp /tmp/trove-mongodb-controller-guestagent.py \$trove_site/trove_yggdrasil_mongodb/guestagent.py
              cp /tmp/trove-mongodb-controller-taskmanager.py \$trove_site/trove_yggdrasil_mongodb/taskmanager.py
      when: (openstack_release|string) != '2025.2'

    - name: Set images fact
      set_fact:
        images:
          - image: quay.io/openstack.kolla/mariadb-server:{{ image_version }}
            custom_cmds: |
              ln -sf /usr/bin/mariadb /usr/bin/mysql
          - image: quay.io/openstack.kolla/nova-novncproxy:{{ image_version }}
            # TODO: Does I need to chown root:root below because I'm the image edits
            # This edits become node-specific so can't be shared image
            custom_cmds: |
              sed -i \"s/'ws' in expected_protos/True/g;s/'wss' in expected_protos/True/g\" /var/lib/kolla/venv/lib/python3.12/site-packages/nova/console/websocketproxy.py
              cat > /usr/local/bin/kolla_nova_extend_start <<'EOF'
              touch /dev/shm/$(hostname)_nova-novncproxy_qmanager
              chown root:root /dev/shm/$(hostname)_nova-novncproxy_qmanager
              chmod 644 /dev/shm/$(hostname)_nova-novncproxy_qmanager
              EOF
          - image: quay.io/openstack.kolla/zun-compute:{{ image_version }}
            customize_marker: customize-zun-compute-cpu-stats-v1.done
            custom_files:
              - src: scripts/kolla-ansible/patch-zun-cpu-stats.py
                dest: /tmp/patch-zun-cpu-stats.py
            custom_cmds: |
              /var/lib/kolla/venv/bin/python /tmp/patch-zun-cpu-stats.py
          - image: quay.io/openstack.kolla/zun-wsproxy:{{ image_version }}
            customize_marker: customize-zun-wsproxy-mtls-v1.done
            custom_files:
              - src: scripts/kolla-ansible/patch-zun-wsproxy-mtls.py
                dest: /tmp/patch-zun-wsproxy-mtls.py
            custom_cmds: |
              /var/lib/kolla/venv/bin/python /tmp/patch-zun-wsproxy-mtls.py
          - image: quay.io/openstack.kolla/trove-api:{{ image_version }}
            customize_marker: customize-trove-mongodb-topology-v8.done
            custom_files:
              - src: scripts/openstack/trove-mongodb/controller/__init__.py
                dest: /tmp/trove-mongodb-controller-init.py
              - src: scripts/openstack/trove-mongodb/controller/api.py
                dest: /tmp/trove-mongodb-controller-api.py
              - src: scripts/openstack/trove-mongodb/controller/guestagent.py
                dest: /tmp/trove-mongodb-controller-guestagent.py
              - src: scripts/openstack/trove-mongodb/controller/taskmanager.py
                dest: /tmp/trove-mongodb-controller-taskmanager.py
            custom_cmds: |
              trove_site=\$(find /var/lib/kolla/venv/lib -maxdepth 2 -type d -name site-packages -print -quit)
              install -d \$trove_site/trove_yggdrasil_mongodb
              cp /tmp/trove-mongodb-controller-init.py \$trove_site/trove_yggdrasil_mongodb/__init__.py
              cp /tmp/trove-mongodb-controller-api.py \$trove_site/trove_yggdrasil_mongodb/api.py
              cp /tmp/trove-mongodb-controller-guestagent.py \$trove_site/trove_yggdrasil_mongodb/guestagent.py
              cp /tmp/trove-mongodb-controller-taskmanager.py \$trove_site/trove_yggdrasil_mongodb/taskmanager.py
          - image: quay.io/openstack.kolla/trove-taskmanager:{{ image_version }}
            customize_marker: customize-trove-mongodb-topology-v8.done
            custom_files:
              - src: scripts/openstack/trove-mongodb/controller/__init__.py
                dest: /tmp/trove-mongodb-controller-init.py
              - src: scripts/openstack/trove-mongodb/controller/api.py
                dest: /tmp/trove-mongodb-controller-api.py
              - src: scripts/openstack/trove-mongodb/controller/guestagent.py
                dest: /tmp/trove-mongodb-controller-guestagent.py
              - src: scripts/openstack/trove-mongodb/controller/taskmanager.py
                dest: /tmp/trove-mongodb-controller-taskmanager.py
            custom_cmds: |
              trove_site=\$(find /var/lib/kolla/venv/lib -maxdepth 2 -type d -name site-packages -print -quit)
              install -d \$trove_site/trove_yggdrasil_mongodb
              cp /tmp/trove-mongodb-controller-init.py \$trove_site/trove_yggdrasil_mongodb/__init__.py
              cp /tmp/trove-mongodb-controller-api.py \$trove_site/trove_yggdrasil_mongodb/api.py
              cp /tmp/trove-mongodb-controller-guestagent.py \$trove_site/trove_yggdrasil_mongodb/guestagent.py
              cp /tmp/trove-mongodb-controller-taskmanager.py \$trove_site/trove_yggdrasil_mongodb/taskmanager.py
      when: (openstack_release|string) == '2025.2'

    - name: Pull images
      shell: |
        set -xe
        docker inspect {{ item.image }} >/dev/null  || docker pull {{ item.image }}
      register: docker_pull
      changed_when: ("Downloaded newer image" in docker_pull.stdout)
      loop: "{{ images }}"

    - name: Customize images
      shell: |
        set -xe
        docker rm -f tmp_build 2>/dev/null || true
        docker run -it -d --network host -u root --name tmp_build {{ item.item.image }} bash
        {% for custom_file in item.item.custom_files | default([]) %}
        docker cp {{ playbook_dir }}/../{{ custom_file.src }} tmp_build:{{ custom_file.dest }}
        {% endfor %}
        docker exec tmp_build bash -c "set -xe; (ls {{ item.item.customize_marker | default('customize.done') }} && touch do_not_commit) || ( {{ item.item.custom_cmds }} ) && touch {{ item.item.customize_marker | default('customize.done') }}" || (docker rm -f tmp_build; exit 1)
        docker exec tmp_build ls do_not_commit || docker commit -c 'ENTRYPOINT ["dumb-init", "--"]' -c 'CMD ["kolla_start"]' tmp_build {{ item.item.image }}
      loop: "{{ docker_pull.results }}"
      register: customize_images
      changed_when: '"docker commit" in customize_images.stderr'
      when:
        - item.item.custom_cmds is defined
        - item.item.custom_cmds | length > 0
         
    # Doesn't work part of shell above..
    - name: Delete tmp build 
      shell: |
        docker rm -f tmp_build
      failed_when: false
      changed_when: false
      
