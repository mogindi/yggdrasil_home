---
# Prereqs:
# - Ensure passwordless ssh access
# - Configure interface with static ip
# - If not dev, configure devices

- name: Set up devices
  hosts: deployment_controller
  any_errors_fatal: true
  vars:
    docker_pki_root: /etc/yggdrasil/zun-docker-pki
  tasks:
    - name: Install tools on deployment controller
      apt:
        name: 
          - qemu-utils
          - cloud-guest-utils
          - libguestfs-tools
          - cifs-utils
          - openssl
        update_cache: yes

    - name: Create Docker PKI directories
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - "{{ docker_pki_root }}"
        - "{{ docker_pki_root }}/client"
        - "{{ docker_pki_root }}/servers"
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Generate Docker CA private key
      command: >-
        openssl genrsa -out {{ docker_pki_root }}/ca-key.pem 4096
      args:
        creates: "{{ docker_pki_root }}/ca-key.pem"
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Generate Docker CA certificate
      command: >-
        openssl req -x509 -new -sha256 -days 3650
        -key {{ docker_pki_root }}/ca-key.pem
        -subj /CN=yggdrasil-zun-docker-ca
        -out {{ docker_pki_root }}/ca.pem
      args:
        creates: "{{ docker_pki_root }}/ca.pem"
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Write Docker client certificate extensions
      copy:
        dest: "{{ docker_pki_root }}/client/extensions.cnf"
        owner: root
        group: root
        mode: '0600'
        content: |
          basicConstraints = critical,CA:FALSE
          keyUsage = critical,digitalSignature,keyEncipherment
          extendedKeyUsage = clientAuth
      register: docker_client_extensions
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Generate Docker client private key
      command: >-
        openssl genrsa -out {{ docker_pki_root }}/client/key.pem 4096
      args:
        creates: "{{ docker_pki_root }}/client/key.pem"
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Check Docker client certificate lifetime
      command: >-
        openssl x509 -checkend 2592000 -noout
        -in {{ docker_pki_root }}/client/cert.pem
      register: docker_client_certificate_check
      changed_when: false
      failed_when: false
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Generate Docker client certificate request
      command: >-
        openssl req -new
        -key {{ docker_pki_root }}/client/key.pem
        -subj /CN=zun
        -out {{ docker_pki_root }}/client/client.csr
      when:
        - openstack_zun_kata_enabled | default(false) | bool
        - docker_client_extensions.changed or docker_client_certificate_check.rc != 0

    - name: Sign Docker client certificate
      command: >-
        openssl x509 -req -sha256 -days 397
        -in {{ docker_pki_root }}/client/client.csr
        -CA {{ docker_pki_root }}/ca.pem
        -CAkey {{ docker_pki_root }}/ca-key.pem
        -CAcreateserial
        -extfile {{ docker_pki_root }}/client/extensions.cnf
        -out {{ docker_pki_root }}/client/cert.pem
      when:
        - openstack_zun_kata_enabled | default(false) | bool
        - docker_client_extensions.changed or docker_client_certificate_check.rc != 0

    - name: Generate per-host Docker server certificates
      include_tasks: tasks/docker_server_certificate.yml
      loop: "{{ groups['deployment_nodes'] }}"
      loop_control:
        loop_var: docker_server_host
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Protect Docker PKI private files
      file:
        path: "{{ item }}"
        owner: root
        group: root
        mode: '0600'
      loop:
        - "{{ docker_pki_root }}/ca-key.pem"
        - "{{ docker_pki_root }}/client/key.pem"
        - "{{ docker_pki_root }}/ca.srl"
      failed_when: false
      when: openstack_zun_kata_enabled | default(false) | bool

- name: Set up devices
  hosts: deployment_nodes
  any_errors_fatal: true
  tasks:
    - name: Install prereqs
      apt:
        name:
          - dnsutils
          - net-tools
          - lvm2
          - openssh-server
          - bridge-utils
          - curl
          - ca-certificates
          - gnupg
          - lsb-release
          - net-tools
          - traceroute
          - vim
          - jq
          - watchman
          - cifs-utils
          - qemu-utils
          - zstd
        update_cache: yes
        cache_valid_time: 3600

    - name: Update and upgrade apt packages
      apt:
        upgrade: yes
        update_cache: yes

    - name: Configure hostname
      hostname:
        name: "{{ inventory_hostname }}"

    - name: Add hosts on deployment controller
      blockinfile:
        state: present
        dest: /etc/hosts
        content: |
          {% for host in groups['deployment_nodes'] %}
          {{ hostvars[host].network_openstack_mgmt_ip | ansible.utils.ipaddr('address') }} {{ host }}
          {% endfor %}
      delegate_to: "{{ groups['deployment_controller'][0] }}"
      when: groups['deployment_controller'][0] not in groups['deployment_nodes']
      run_once: true

      # Needed to be added before cephadm deployment
      # Kolla ansible prepare does the same thing
      # Addin the mark "# BEGIN ANSIBLE..." so that duplicates aren't added later :)
    - name: Configure hosts on deployment nodes
      copy: 
        dest: /etc/hosts
        content: |
          127.0.0.1 localhost

          # BEGIN ANSIBLE GENERATED HOSTS
          {% for host in groups['deployment_nodes'] %}
          {{ hostvars[host].network_openstack_mgmt_ip | ansible.utils.ipaddr('address') }} {{ host }}
          {% endfor %}
          # END ANSIBLE GENERATED HOSTS

    - name: Add netplan overrides file
      copy:
        dest: /etc/netplan/55-overrides.yaml
        mode: 0600
        content: "{{ network_netplan_overrides_file | to_nice_yaml }}"
      when: network_netplan_overrides_file | length > 0
      register: netplan_config_0
      tags: netplan

    - name: netplan apply
      command: netplan apply
      when: netplan_config_0.changed | default(false)
      tags: netplan

    - name: Stop and disable NetworkManager
      systemd:
        name: NetworkManager.service
        state: stopped
        enabled: no
      failed_when: false

    - sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: yes
        state: present
        reload: yes

    - sysctl:
        name: fs.inotify.max_user_instances
        value: '512'
        sysctl_set: yes
        state: present
        reload: yes

    - name: Run script to setup veth pair
      script: "{{ playbook_dir }}/../scripts/devices/veth_pair.sh"
      when: network_create_veth_pair

    # when running in development using neutron_ext vlan
    - name: Run script to masquerade vlans when exiting primary interface
      script: "{{ playbook_dir }}/../scripts/devices/masquerade.sh"
      when: network_masquerade_vlans

    - name: Set performance cpu governor 
      shell: |
        cat > /etc/systemd/system/yggdrasil_cpu_performance_governor.service <<EOF
        [Unit]
        Description=Set performance cpu governor

        [Service]
        ExecStart=/bin/bash -c "echo performance | sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor"
        Type=oneshot

        [Install]
        WantedBy=default.target
        EOF

        systemctl daemon-reload
        systemctl restart yggdrasil_cpu_performance_governor.service
        systemctl enable yggdrasil_cpu_performance_governor.service

    - name: Configure additional routes in main routing table
      shell: |
        cat > /etc/systemd/system/network_create_routes.service <<EOF
        [Unit]
        Description=Network routes for table main
        After=network.target

        [Service]
        {% for route in network_extra_routes_main_table.routes %}
        ExecStart=/bin/bash -c "ip route show table main | grep -q \"{{ route }}\" || ip route add {{ route }} table main"
        {% endfor %}
        Type=oneshot

        [Install]
        WantedBy=default.target
        RequiredBy=network.target
        EOF

        systemctl daemon-reload && \
        systemctl restart network_create_routes.service && \
        systemctl enable network_create_routes.service
      when:
        - network_extra_routes_main_table is defined
        - network_extra_routes_main_table.routes is defined
        - network_extra_routes_main_table.routes | length > 0
      tags: routes
        

    - name: Configure additional route tables
      environment:
        table: "{{ item.table }}"
        network_cidr: "{{ item.network_cidr }}"
        table_id: "{{ index | int + 1 }}"
      shell: |
        cat > /etc/systemd/system/network_create_route_table_$table.service <<EOF
        [Unit]
        Description=Network route table $table for $network_cidr
        After=network.target

        [Service]
        ExecStart=/bin/bash -c "grep -q \"$table_id $table\" /etc/iproute2/rt_tables || ( echo \"$table_id $table\" | tee -a /etc/iproute2/rt_tables )"
        ExecStart=/bin/bash -c "ip rule list | grep -q \"from $network_cidr\" || ip rule add from $network_cidr lookup $table"
        ExecStart=/bin/bash -c "ip rule list | grep -q \"to $network_cidr\" || ip rule add to $network_cidr lookup $table"
        {% for route in item.routes %}
        ExecStart=/bin/bash -c "ip route show table $table | grep -q \"{{ route }}\" || ip route add {{ route }} table $table"
        {% endfor %}
        Type=oneshot

        [Install]
        WantedBy=default.target
        RequiredBy=network.target
        EOF

        systemctl daemon-reload && \
        systemctl restart network_create_route_table_$table.service && \
        systemctl enable network_create_route_table_$table.service
      loop: "{{ network_extra_route_tables | default([]) }}"
      loop_control:
        index_var: index
      tags: routes

    # # DO WE REALLY NEED THIS, IF WE USE VPN?
    # - name: Configure network routes on deployment controller
    #   script: "{{ playbook_dir }}/../scripts/devices/configure_routes.sh"
    #   environment:
    #     OPENSTACK_MGMT_NET: "{{ network_openstack_mgmt_ip | ansible.utils.ipaddr('network/prefix') }}"
    #     CEPH_PUBLIC_NET: "{{ network_ceph_public_ip | ansible.utils.ipaddr('network/prefix') }}"
    #     NETWORK_PROVIDER_NETS: "{%- for subnet in openstack_public_network.subnets %}{{ subnet.cidr | ansible.utils.ipaddr('network/prefix') }} {% endfor %}"
    #     NETWORK_PRIMARY_GATEWAY_IP: "{{ network_primary_gateway_ip | ansible.utils.ipaddr('address') }}"
    #     NETWORK_PROVIDER_GATEWAY_IP: "{{ network_provider_gateway_ip | ansible.utils.ipaddr('address') }}"
    #   when: network_add_routes_to_deployment_controller | default(false)
    #   delegate_to: "{{ groups['deployment_controller'][0] }}"
    #   run_once: true

    - name: Create cni directory for Zun
      file:
        path: /opt/cni/bin
        state: directory
        mode: '0755'

    - name: Resolve Kata release architecture
      set_fact:
        kata_release_arch: "{{ kata_architectures[ansible_architecture] | default('') }}"
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Validate Kata host architecture and virtualization
      assert:
        that:
          - kata_release_arch | length > 0
          - ansible_virtualization_type not in ['docker', 'lxc', 'openvz']
        fail_msg: >-
          Kata requires a supported CPU architecture and hardware or nested
          virtualization; it cannot run inside an ordinary system container.
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Check for KVM device
      stat:
        path: /dev/kvm
      register: kata_kvm_device
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Require KVM acceleration for Kata
      assert:
        that: kata_kvm_device.stat.exists
        fail_msg: >-
          /dev/kvm is unavailable. Enable virtualization in firmware or expose
          nested virtualization to this deployment node before continuing.
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Download pinned Kata static release
      get_url:
        url: >-
          https://github.com/kata-containers/kata-containers/releases/download/{{ kata_version }}/kata-static-{{ kata_version }}-{{ kata_release_arch }}.tar.zst
        dest: "/var/cache/kata-static-{{ kata_version }}-{{ kata_release_arch }}.tar.zst"
        checksum: "sha256:{{ kata_checksums[kata_release_arch] }}"
        mode: '0644'
        timeout: 120
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Create versioned Kata installation directory
      file:
        path: "/opt/kata-{{ kata_version }}"
        state: directory
        mode: '0755'
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Check for incorrectly nested Kata release
      stat:
        path: "/opt/kata-{{ kata_version }}/kata/bin/kata-runtime"
      register: kata_nested_runtime
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Remove incorrectly nested Kata release
      file:
        path: "/opt/kata-{{ kata_version }}/kata"
        state: absent
      when:
        - openstack_zun_kata_enabled | default(false) | bool
        - kata_nested_runtime.stat.exists

    - name: Extract Kata static release
      command: >-
        tar --zstd -xf /var/cache/kata-static-{{ kata_version }}-{{ kata_release_arch }}.tar.zst
        -C /opt/kata-{{ kata_version }} --strip-components=3
      args:
        creates: "/opt/kata-{{ kata_version }}/bin/kata-runtime"
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Select installed Kata version
      file:
        src: "/opt/kata-{{ kata_version }}"
        dest: /opt/kata
        state: link
        force: true
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Expose Kata runtime binaries on PATH
      file:
        src: "/opt/kata/bin/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        state: link
        force: true
      loop:
        - kata-runtime
        - containerd-shim-kata-v2
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Validate Kata runtime support
      command: /opt/kata/bin/kata-runtime check
      changed_when: false
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Read existing Docker daemon configuration
      slurp:
        src: /etc/docker/daemon.json
      register: docker_daemon_configuration
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Register Kata runtime with Docker
      copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
        content: >-
          {{
            (docker_daemon_configuration.content | b64decode | from_json)
            | combine(
                {'runtimes': {'kata': {'runtimeType': 'io.containerd.kata.v2'}}},
                recursive=True
              )
            | to_nice_json
          }}
      notify: Restart Docker for Kata
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Create Docker server PKI directory
      file:
        path: /etc/docker/pki
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Install Docker server trust and certificate
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - src: /etc/yggdrasil/zun-docker-pki/ca.pem
          dest: /etc/docker/pki/ca.pem
          mode: '0644'
        - src: "/etc/yggdrasil/zun-docker-pki/servers/{{ inventory_hostname }}/cert.pem"
          dest: /etc/docker/pki/cert.pem
          mode: '0644'
        - src: "/etc/yggdrasil/zun-docker-pki/servers/{{ inventory_hostname }}/key.pem"
          dest: /etc/docker/pki/key.pem
          mode: '0600'
      notify: Restart Docker for Kata
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Create Zun Docker client PKI directory
      file:
        path: /etc/zun/docker-pki
        state: directory
        owner: root
        group: '42463'
        mode: '0750'
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Install Zun Docker client credentials
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - src: /etc/yggdrasil/zun-docker-pki/ca.pem
          dest: /etc/zun/docker-pki/ca.pem
          group: root
          mode: '0644'
        - src: /etc/yggdrasil/zun-docker-pki/client/cert.pem
          dest: /etc/zun/docker-pki/cert.pem
          group: root
          mode: '0644'
        - src: /etc/yggdrasil/zun-docker-pki/client/key.pem
          dest: /etc/zun/docker-pki/key.pem
          group: '42463'
          mode: '0640'
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Create Docker systemd override directory
      file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Configure Docker mTLS listener for Zun
      copy:
        dest: /etc/systemd/system/docker.service.d/override.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/dockerd -H fd:// -H tcp://{{ network_openstack_mgmt_ip | ansible.utils.ipaddr('address') }}:2376 --tlsverify --tlscacert=/etc/docker/pki/ca.pem --tlscert=/etc/docker/pki/cert.pem --tlskey=/etc/docker/pki/key.pem --containerd=/run/containerd/containerd.sock
      notify: Restart Docker for Kata
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Apply Docker runtime and mTLS configuration
      meta: flush_handlers

    - name: Verify Docker advertises Kata runtime
      command:
        argv:
          - docker
          - info
          - --format
          - "{{ '{{json .Runtimes}}' }}"
      register: docker_runtime_info
      changed_when: false
      failed_when: "'kata' not in docker_runtime_info.stdout"
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Verify Docker API using Zun client certificate
      command: >-
        docker --host tcp://{{ network_openstack_mgmt_ip | ansible.utils.ipaddr('address') }}:2376
        --tlsverify
        --tlscacert /etc/zun/docker-pki/ca.pem
        --tlscert /etc/zun/docker-pki/cert.pem
        --tlskey /etc/zun/docker-pki/key.pem
        version
      changed_when: false
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Verify Docker API rejects clients without a certificate
      command: >-
        curl --fail --silent --show-error
        --cacert /etc/zun/docker-pki/ca.pem
        https://{{ network_openstack_mgmt_ip | ansible.utils.ipaddr('address') }}:2376/_ping
      register: docker_api_without_client_certificate
      changed_when: false
      failed_when: docker_api_without_client_certificate.rc == 0
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Inspect secured Docker API listener
      shell: "ss -ltnH 'sport = :2376'"
      register: docker_api_listener
      changed_when: false
      failed_when: >-
        (network_openstack_mgmt_ip | ansible.utils.ipaddr('address')) not in docker_api_listener.stdout
        or '0.0.0.0:2376' in docker_api_listener.stdout
      when: openstack_zun_kata_enabled | default(false) | bool

    - name: Verify insecure Docker API is closed
      shell: "! ss -ltnH 'sport = :2375' | grep -q ."
      changed_when: false
      when: openstack_zun_kata_enabled | default(false) | bool

    #- name: Run internet connectivity script
    #  script: "{{ playbook_dir }}/../scripts/devices/revive_internet.sh {{ network_default_gateway_interface }}"

    - name: Configure loop devices
      script: "{{ playbook_dir }}/../scripts/devices/loop.sh"
      environment:
        LOOP_DEVICE_SIZE_GB: "{{ storage_loop_device_size_gb }}"
      when: storage_create_loop_devices

  handlers:
    - name: Restart Docker for Kata
      systemd:
        name: docker.service
        state: restarted
        enabled: yes
        daemon_reload: yes

- name: Remove internet connectivity script and destroy loop devices
  hosts: deployment_nodes
  any_errors_fatal: true
  tags:
    - destroy
    - never
  tasks:
    - name: Destroy devices
      script: "{{ playbook_dir }}/../scripts/devices/destroy.sh"
      when: storage_create_loop_devices
