---
all:

  # hosts and hostvars and all shared vars
  hosts:
  
    deploy01:
      ansible_host: "{{ lookup('ansible.builtin.pipe', 'hostname -I | cut -d \" \" -f 1') }}"
      ansible_connection: local
    hyper01:
      ansible_host: hyper01
      inventory_index: 1
    hyper02:
      ansible_host: hyper02
      inventory_index: 2

  vars:
        
    network_create_veth_pair: true
    network_add_routes_to_deployment_controller: true
    network_masquerade_vlans: true

    network_primary_gateway_ip: 192.168.121.1/24
    network_primary_interface: eth0

    last_ip_octet: "{{ inventory_index + 10 }}"
    network_openstack_mgmt_ip: "10.0.10.{{ last_ip_octet }}/24"
    network_ceph_public_ip: "10.0.50.{{ last_ip_octet }}/24"
    network_ceph_cluster_ip: "10.0.60.{{ last_ip_octet }}/24"

    network_provider_gateway_ip: 10.0.80.1/24
    network_provider_gateway_interface: eth1  # This interface shouldn't have an ip set. In the future, if u want to set an IP we have to use br-ex
  
    # TODO: Maybe create br-ex bridge to have more control
    ethernets: "{{ { network_provider_gateway_interface : { 'addresses' : [] } } }}"
    network_netplan_overrides_file:
      network:
        version: 2
        renderer: networkd
        ethernets: "{{ ethernets }}"
        bridges:
          br0:
            interfaces: ["{{ network_provider_gateway_interface }}"]
            addresses: ["10.0.80.{{ last_ip_octet }}/24"]
        vlans:
          # openstack management vlan
          openstack_mgmt:
            id: 10
            link: "{{ network_primary_interface }}"
            addresses: 
              - "{{ network_openstack_mgmt_ip }}"
          # ceph public vlan
          ceph_public:
            id: 50
            link: "{{ network_primary_interface }}"
            addresses:
              - "{{ network_ceph_public_ip }}"
          # ceph cluster vlan
          ceph_cluster:
            id: 60
            link: "{{ network_primary_interface }}"
            addresses:
              - "{{ network_ceph_cluster_ip }}"
          # # neutron external vlan
          # neutron_ext:
          #   id: 80
          #   link: "{{ network_primary_interface }}"
          #   addresses:
          #     - "{{ network_provider_ip }}"
  
    storage_create_loop_devices: true
    storage_loop_device_size_gb: 70
    storage_ceph_osd_devices:
      - /dev/vg-0/lv-0
      - /dev/vg-1/lv-1
      - /dev/vg-2/lv-2
    storage_ceph_default_pool_size: 1
    storage_ceph_default_min_pool_size: "{{ storage_ceph_default_pool_size }}"
    
    openstack_release: 2024.1
    openstack_network_guard_enabled: false
    openstack_zun_kata_enabled: true
    kata_version: 3.31.0
    kata_architectures:
      x86_64: amd64
      aarch64: arm64
      ppc64le: ppc64le
      s390x: s390x
    kata_checksums:
      amd64: 68c2786a0b97023f62f3eca02dc868b78a794e5469d4ddd6cc9e0bd4a7212b0b
      arm64: 42a7e67a2c2bf3e97a615c99a293b2bc01ea9c84111fc2bf4abeedb7adc9c2ac
      ppc64le: 2099a94113a847872b762e94d9aff0d61f08d71ba1428f5ffb5687537e5db0d4
      s390x: 8f70e5560bcd1e73a530238b7d2e8bb51e28d2ed840c835454128dfca8fef480
    openstack_network_interface: openstack_mgmt
    openstack_neutron_external_interface: veth0
    openstack_kolla_internal_vip_address: 10.0.10.100
    openstack_designate_forwarders_first_address: 8.8.8.8
    openstack_designate_forwarders_second_address: 8.8.4.4
    openstack_ceph_rgw_hosts: >-
      [{% for node in groups['deployment_nodes'] %}
        { 'host': '{{ node }}', 'ip': '{{ hostvars[node].network_ceph_public_ip | ansible.utils.ipaddr('address') }}', 'port': '6780' }
      {% if not loop.last %},{% endif %}{% endfor %}]
    # Cinder uses the root RadosGW S3 endpoint for volume backups.  The
    # playbook creates the access secret in RGW and writes it to the generated
    # Kolla globals.d configuration; no secret belongs in inventory.
    openstack_cinder_backup_s3_user: cinder-backup
    openstack_cinder_backup_s3_access_key: CINDERBACKUP
    openstack_cinder_backup_s3_bucket: cinder-backups
    openstack_cinder_backup_s3_endpoint_url: "http://{{ openstack_kolla_internal_vip_address }}:6780"
    openstack_worker_count: 1

    openstack_public_network:
      cidr: 10.0.80.0/24
      gateway_ip: 10.0.80.1
      allocation_start: 10.0.80.100
      allocation_end: 10.0.80.200

    openstack_amphora_subnet_cidr: 10.1.0.0/24
    openstack_amphora_router_gateway_ip:  10.1.0.1
    openstack_octavia_mgmt_router_external_gateway_ip: 10.0.80.3  # should be outside dhcp range?

  # groups and group vars
  children:
    deployment_controller:
      hosts:
        deploy01:
    deployment_nodes:
      hosts:
        hyper01:
        hyper02:
