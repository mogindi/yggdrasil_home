---
# Shared Ceph package and container image version.
ceph_version: "19.2.3"

# Kolla merges this host-specific YAML into each OpenSearch node's
# configuration so the multi-node development environment uses the same disk
# watermark thresholds as AIO.
kolla_custom_configs:
  opensearch:
    hyper01:
      opensearch.yml: |
        cluster.routing.allocation.disk.watermark.high: "94%"
        cluster.routing.allocation.disk.watermark.flood_stage: "96%"
    hyper02:
      opensearch.yml: |
        cluster.routing.allocation.disk.watermark.high: "94%"
        cluster.routing.allocation.disk.watermark.flood_stage: "96%"
