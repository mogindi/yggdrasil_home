---
last_ip_octet: "{{ inventory_index + 10 }}"

vpn_ip: "10.84.0.{{ last_ip_octet }}/24"
vpn_interface: vpn0
vpn_port: 7000

network_primary_interface: vpn0

network_openstack_mgmt_ip: "10.0.10.{{ last_ip_octet }}/24"
network_ceph_public_ip: "10.0.50.{{ last_ip_octet }}/24"
network_ceph_cluster_ip: "10.0.60.{{ last_ip_octet }}/24"

network_netplan_overrides_file:
  network:
    version: 2
    renderer: networkd
    ethernets:
      vpn0:
        addresses:
          - "{{ vpn_ip }}"
    bridges:
      br0:
        interfaces: []
        addresses: [192.168.150.1/24]
    vlans:
      # openstack management vlan
      openstack_mgmt:
        id: 10
        link: "{{ network_primary_interface }}"
        addresses:
          - "{{ network_openstack_mgmt_ip }}"
      # ceph public vlan
      ceph_public:
        id: 50
        link: "{{ network_primary_interface }}"
        addresses:
          - "{{ network_ceph_public_ip }}"
      # ceph cluster vlan
      ceph_cluster:
        id: 60
        link: "{{ network_primary_interface }}"
        addresses:
          - "{{ network_ceph_cluster_ip }}"

network_create_veth_pair: true
network_add_routes_to_deployment_controller: false
network_masquerade_vlans: true

network_provider_gateway_ip: 192.168.150.1/24

network_provider_gateway_keepalived_interface: br0
network_provider_gateway_keepalived_vip: 192.168.150.2

network_extra_routes_main_table:
  routes:
    - 10.1.0.0/24 via 192.168.150.11 dev br0

storage_create_loop_devices: true
storage_loop_device_size_gb: 20
storage_ceph_osd_devices:
  - /dev/vg-0/lv-0
  - /dev/vg-1/lv-1
  - /dev/vg-2/lv-2
storage_ceph_default_pool_size: 1
storage_ceph_default_min_pool_size: "{{ storage_ceph_default_pool_size }}"
storage_ceph_osd_discard: true

openstack_release: 2025.2
openstack_network_guard_enabled: false
openstack_zun_kata_enabled: true
kata_version: 3.31.0
kata_architectures:
  x86_64: amd64
  aarch64: arm64
  ppc64le: ppc64le
  s390x: s390x
kata_checksums:
  amd64: 68c2786a0b97023f62f3eca02dc868b78a794e5469d4ddd6cc9e0bd4a7212b0b
  arm64: 42a7e67a2c2bf3e97a615c99a293b2bc01ea9c84111fc2bf4abeedb7adc9c2ac
  ppc64le: 2099a94113a847872b762e94d9aff0d61f08d71ba1428f5ffb5687537e5db0d4
  s390x: 8f70e5560bcd1e73a530238b7d2e8bb51e28d2ed840c835454128dfca8fef480
openstack_network_interface: openstack_mgmt
openstack_neutron_external_interface: veth0
openstack_kolla_internal_vip_address: 10.0.10.100
openstack_designate_forwarders_first_address: 8.8.8.8
openstack_designate_forwarders_second_address: 8.8.4.4
openstack_ceph_rgw_hosts:
  - host: "{{ lookup('ansible.builtin.pipe', 'hostname') }}"
    ip: "{{ lookup('ansible.builtin.pipe', 'ip --json address show ceph_public | jq -r .[0].addr_info[0].local') }}"
    port: 6780
# Cinder uses the root RadosGW S3 endpoint for volume backups.  The
# playbook creates the access secret in RGW and writes it to the generated
# Kolla globals.d configuration; no secret belongs in inventory.
openstack_cinder_backup_s3_user: cinder-backup
openstack_cinder_backup_s3_access_key: CINDERBACKUP
openstack_cinder_backup_s3_bucket: cinder-backups
openstack_cinder_backup_s3_endpoint_url: "http://{{ openstack_kolla_internal_vip_address }}:6780"
openstack_worker_count: 1

openstack_public_network:
  name: public1  # name is hardcorded in a few places, so don't change this unless you know what you're doing
  mtu: 1400
  subnets:
    - name: public1-subnet  # name is hardcorded in a few places, so don't change this unless you know what you're doing
      cidr: 192.168.150.0/24
      gateway_ip: 192.168.150.1
      allocation_start: 192.168.150.100
      allocation_end: 192.168.150.200

openstack_amphora_network:
  cidr: 10.1.0.0/24
  gateway_ip: 10.1.0.1
  allocation_start: 10.1.0.40
  allocation_end: 10.1.0.254
  router_external_ip: 192.168.150.11
