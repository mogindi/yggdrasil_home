- name: Check networking
  hosts: deployment_nodes
  any_errors_fatal: true
  tasks:
    - name: Check interfaces exist
      command: ifconfig {{ item }}
      loop:
        - "{{ openstack_network_interface }}"
        - "{{ openstack_neutron_external_interface }}"

    - name: Check nodes could ping each other on the different vlans
      command: ping -c 1 -W 2 {{ hostvars[item[0]][item[1]] | ansible.utils.ipaddr('address') }}
      loop: "{{ groups['deployment_nodes'] | product(['network_openstack_mgmt_ip', 'network_ceph_public_ip', 'network_ceph_cluster_ip']) | list }}"

    - name: Detect provider gateway VIP owner
      shell: ip -4 addr show dev br0 | grep -Fq "{{ network_provider_gateway_keepalived_vip | ansible.utils.ipaddr('address') }}/32"
      register: provider_vip_present
      changed_when: false
      failed_when: false
      when: network_provider_gateway_keepalived_vip is defined

    - name: Check internet through provider gateway VIP
      command: ping -c 1 -W 2 -I "{{ network_provider_gateway_keepalived_vip | ansible.utils.ipaddr('address') }}" 8.8.8.8
      when:
        - network_provider_gateway_keepalived_vip is defined
        - provider_vip_present.rc == 0

    - name: Check internet through provider network
      command: ping -c 1 -W 2 -I "{{ network_provider_gateway_keepalived_interface | default('br0') }}" 8.8.8.8
      when: network_provider_gateway_keepalived_vip is not defined


- name: Check networking on deployment controller
  hosts: deployment_controller
  any_errors_fatal: true
  tasks:

    - name: Check hosts file in deployment controller
      command: grep {{ item }} /etc/hosts
      loop: "{{ groups['deployment_nodes'] }}"

    - name: Check deployment controller can ping vlans
      command: ping -c 1 -W 2 {{ hostvars[item[0]][item[1]] | ansible.utils.ipaddr('address') }}
      loop: "{{ groups['deployment_nodes'] | product(['network_openstack_mgmt_ip', 'network_ceph_public_ip'] ) | list }}"

- name: Check storage
  hosts: deployment_nodes
  any_errors_fatal: true
  tasks:
  
    - name: Check storage devices exist
      command: ls {{ item }}
      loop: "{{ storage_ceph_osd_devices }}"

    - name: Check storage devices not mounted
      shell: "! (mount | grep {{ item }})"
      loop: "{{ storage_ceph_osd_devices }}"
