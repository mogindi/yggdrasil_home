---
- name: Prepare ceph nodes
  hosts:
    - deployment_controller
    - deployment_nodes
  any_errors_fatal: true
  vars:
    ceph_release: squid
  tasks:
    - name: Install cephadm key
      ansible.builtin.apt_key:
        url: https://download.ceph.com/keys/release.asc

    - name: Install bootstrap cephadm package
      apt:
        pkg: cephadm
        state: present
        update_cache: true
      when: inventory_hostname in groups['deployment_nodes']

    # splitting because fails when deployment_controller also as deployment_node (apt-get lock)
    - name: Install bootstrap cephadm package
      apt:
        pkg: cephadm
        state: present
        update_cache: true
      when: inventory_hostname in groups['deployment_controller']

    - name: Configure the official Ceph release repository
      command: "cephadm add-repo --release {{ ceph_release }}"
      changed_when: false

    - name: Install latest Ceph client packages from the release repository
      apt:
        pkg:
          - cephadm
          - ceph-common
        state: latest
        update_cache: true
      when: inventory_hostname in groups['deployment_nodes']

    # splitting because fails when deployment_controller also as deployment_node (apt-get lock)
    - name: Install latest Ceph client packages from the release repository
      apt:
        pkg:
          - cephadm
          - ceph-common
        state: latest
        update_cache: true
      when: inventory_hostname in groups['deployment_controller']

    - name: Create ceph directories
      file:
        path: "{{ item}}"
        state: directory
      loop:
        - /etc/ceph/
        - /var/lib/cephadm/.ssh/

- name: Deploy cephadm
  hosts: deployment_nodes[0]
  any_errors_fatal: true
  vars:
    ceph_release: squid
    ceph_image_registry: quay.io/ceph/ceph
  tasks:
    - name: Read the installed Ceph client version
      command: ceph --version
      register: ceph_client_version
      changed_when: false

    - name: Derive the exact Ceph container version from the client
      set_fact:
        ceph_version: "{{ ceph_client_version.stdout | regex_search('version ([0-9]+\\.[0-9]+\\.[0-9]+)', '\\1') }}"

    - name: Require a valid Ceph client version
      ansible.builtin.assert:
        that:
          - ceph_client_version.rc == 0
          - ceph_version is string
          - ceph_version is match('^[0-9]+\\.[0-9]+\\.[0-9]+$')
        fail_msg: "Could not determine an exact Ceph client version from: {{ ceph_client_version.stdout | default('') }}"

    - name: Set the exact Ceph container image
      set_fact:
        ceph_image: "{{ ceph_image_registry }}:v{{ ceph_version }}"

    - name: Read Ceph client versions on all managed hosts
      command: ceph --version
      delegate_to: "{{ item }}"
      loop: "{{ (groups['deployment_nodes'] + groups['deployment_controller']) | unique }}"
      register: ceph_client_versions
      changed_when: false

    - name: Require every managed host to use the resolved Ceph version
      ansible.builtin.assert:
        that:
          - client_version.stdout is search('version ' ~ ceph_version ~ ' ')
        fail_msg: >-
          Ceph client version mismatch on {{ client_version.item }}:
          expected {{ ceph_version }}, got {{ client_version.stdout | default('') }}
      loop: "{{ ceph_client_versions.results }}"
      loop_control:
        loop_var: client_version

    - name: Add initial-ceph.conf
      copy: 
        dest: /etc/ceph/initial-ceph.conf
        content: |
          [global]
          osd_pool_default_size = {{ storage_ceph_default_pool_size }}
          osd_pool_default_min_size = {{ storage_ceph_default_min_pool_size }}
          bdev_enable_discard = {{ storage_ceph_osd_discard | default(false) | bool | ternary('true', 'false') }}

          public_network = {{ network_ceph_public_ip | ansible.utils.ipaddr('network/prefix') }}
          cluster_network = {{ network_ceph_public_ip | ansible.utils.ipaddr('network/prefix') }}

    - name: Run cephadm bootstrap
      command: >-
        cephadm --image {{ ceph_image }} bootstrap
        --config /etc/ceph/initial-ceph.conf
        --allow-overwrite
        --mon-ip {{ network_ceph_public_ip | ansible.utils.ipaddr('address') }}
        --skip-monitoring-stack
      args:
        creates: /etc/ceph/ceph.client.admin.keyring
      register: cephadm_bootstrap

    - name: Upgrade existing Ceph daemons to the client version
      command: "ceph orch upgrade start --image {{ ceph_image }}"
      when: not cephadm_bootstrap.changed
      register: cephadm_upgrade
      changed_when: cephadm_upgrade.rc == 0

    - name: Display Ceph upgrade status
      command: ceph orch upgrade status
      when: not cephadm_bootstrap.changed
      changed_when: false
      register: cephadm_upgrade_status

    - name: Verify the Ceph client can read the admin keyring
      command: ceph -n client.admin -k /etc/ceph/ceph.client.admin.keyring auth ls
      changed_when: false

    - name: Get cephadm ssh public key
      command: ceph cephadm get-pub-key
      register: cephadm_pub_key
      changed_when: false

    - name: Add cephadm public key
      authorized_key:
        user: root
        key: "{{ cephadm_pub_key.stdout }}"
        manage_dir: no
      delegate_to: "{{ item }}"
      loop: "{{ groups['deployment_nodes'] }}"

    - name: Add hosts
      command: "ceph orch host add {{ item }} {{ item }} --labels _admin"
      loop: "{{ groups['deployment_nodes'] }}"

    - name: Apply mons placement
      command: "ceph orch apply mon --placement='{% for host in groups['deployment_nodes'] %}{{ host }},{% endfor %}'"

    - name: Add (other) mons
      command: "ceph orch daemon add mon {{ item }}"
      loop: "{{ groups['deployment_nodes'] }}"
      when: item != groups['deployment_nodes'][0]
      failed_when: false

    - pause:
        seconds: 10

    - name: Get ceph status output
      command: ceph status -f json-pretty
      register: ceph_status

    - name: Fail if not all mons added
      fail:
        msg: There are {{ (ceph_status.stdout | from_json).monmap.num_mons }} mons but expected number of mons is {{ groups['deployment_nodes'] | length }}
      when: (ceph_status.stdout | from_json).monmap.num_mons != groups['deployment_nodes'] | length
      
      # Note: This is supposed to happen automatically with _admin label
    - name: Generate new minimal ceph.conf
      command: ceph config generate-minimal-conf
      register: ceph_conf

    - name: Write new ceph.conf
      copy:
        content: "{{ ceph_conf.stdout }}\n"
        dest: /etc/ceph/ceph.conf
      loop: "{{ groups['deployment_nodes'] + groups['deployment_controller'] }}"
      delegate_to: "{{ item }}"

    - name: Get ceph admin keyring
      command: ceph auth get client.admin
      register: ceph_keyring

    - name: Write ceph admin keyring
      copy:
        content: "{{ ceph_keyring.stdout }}\n"
        dest: /etc/ceph/ceph.client.admin.keyring
      loop: "{{ groups['deployment_nodes'] + groups['deployment_controller'] }}"
      delegate_to: "{{ item }}"

    - name: Configure BlueStore OSD discard
      command: >-
        ceph config set osd bdev_enable_discard
        {{ storage_ceph_osd_discard | bool | ternary('true', 'false') }}
      when: storage_ceph_osd_discard is defined

    # run ceph-volume from mon containers
    - name: Zap osds
      shell: |
        set -e
        {% for device in storage_ceph_osd_devices -%}
          docker exec $(docker ps | grep ceph-.*-mon | awk '{print $1}') \
            bash -c "ceph-volume lvm zap {{ device }}"
        {% endfor %}
      delegate_to: "{{ item }}"
      loop: "{{ groups['deployment_nodes'] }}"
      when: cephadm_bootstrap.changed

    - name: Get number osds present
      shell: ceph osd tree | grep osd. | wc -l
      register: ceph_osd_count

    - name: Calculate expected osd devices
      set_fact:
        expected_osd_devices: "{{ (expected_osd_device | default(0) | int) + (hostvars[item].storage_ceph_osd_devices | length) }}"
      loop: "{{ groups['deployment_nodes'] }}"

    - name: Add osds
      shell: |
        set -e
        {% for device in storage_ceph_osd_devices -%}
          ceph orch daemon add osd {{ item }}:{{ device }}
        {% endfor %}
      loop: "{{ groups['deployment_nodes'] }}"
      when: (ceph_osd_count.stdout | int) < (expected_osd_devices | int)

    - name: Create rgw config file
      copy:
        dest: /tmp/rgw.yml
        content: |
          service_type: rgw
          service_id: foo
          placement:
            label: _admin
            count_per_host: 1
          networks:
          - {{ network_ceph_public_ip | ansible.utils.ipaddr('network') }}/{{ network_ceph_public_ip | ansible.utils.ipaddr('prefix') }}
          spec:
            rgw_frontend_port: 6780

    - name: Add rgw
      command: ceph orch apply -i /tmp/rgw.yml

    - name: Enable ceph-exporter
      command: ceph mgr module enable prometheus

    - name: Add pools
      script: "{{ playbook_dir }}/../scripts/cephadm/pools.sh"
      args:
        creates: /root/cephadm_pools.done
      run_once: true

      # need default 8443 on node for nova console proxy. Only possibility on the same dns host if ur using cloudflare
    - name: Change mgr dashboard port
      shell: |
        {% raw %}ceph config set mgr mgr/dashboard/ssl_server_port 8444 && docker ps --format '{{ .Names }}' | grep ceph | grep mgr- | xargs docker restart{% endraw %}

- name: Destroy cephadm cluster
  hosts: deployment_nodes[0]
  any_errors_fatal: true
  tags:
    - destroy
    - never
  tasks:
    - name: Destroy cephadm
      script: "{{ playbook_dir }}/../scripts/cephadm/destroy.sh"

- name: Destroy cephadm cluster
  hosts: deployment_nodes
  tags:
    - destroy
    - never
  tasks:
    - name: Disable ceph daemons
      shell:
        systemctl stop ceph*;
        systemctl disable ceph*;
        systemctl daemon-reload;
        rm -rf /etc/systemd/system/ceph*;
        rm -rf /etc/ceph;
        rm -rf /var/lib/ceph;
        rm -rf /var/log/ceph;
        docker rm -f $(docker ps -a | grep ceph | awk '{print $1}');
      failed_when: false
