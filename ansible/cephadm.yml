---
- name: Prepare ceph nodes
  hosts:
    - deployment_controller
    - deployment_nodes
  any_errors_fatal: true
  tasks:
    - name: Install cephadm shell runtime
      apt:
        pkg: cephadm
        state: present
        update_cache: true
      when: inventory_hostname in groups['deployment_nodes']

    # splitting because fails when deployment_controller also as deployment_node (apt-get lock)
    - name: Install cephadm shell runtime
      apt:
        pkg: cephadm
        state: present
        update_cache: true
      when: inventory_hostname in groups['deployment_controller']

    - name: Create ceph directories
      file:
        path: "{{ item}}"
        state: directory
      loop:
        - /etc/ceph/
        - /var/lib/cephadm/.ssh/

- name: Deploy cephadm
  hosts: deployment_nodes[0]
  any_errors_fatal: true
  vars:
    ceph_image_registry: quay.io/ceph/ceph
    ceph_image_track: v19
    ceph_rgw_frontend_port: "{{ storage_ceph_rgw_frontend_port | default(6780) }}"
  tasks:
    - name: Read the latest Squid Ceph client version from the release image
      command: >-
        cephadm --image {{ ceph_image_registry }}:{{ ceph_image_track }}
        shell -- ceph --version
      register: ceph_client_version
      changed_when: false

    - name: Derive the exact Ceph container version from the client
      set_fact:
        ceph_version: "{{ (ceph_client_version.stdout | regex_findall('version ([0-9]+\\.[0-9]+\\.[0-9]+)')) | first }}"

    - name: Require a valid Ceph client version
      ansible.builtin.assert:
        that:
          - ceph_client_version.rc == 0
          - ceph_version is string
          - ceph_version is match('^[0-9]+\\.[0-9]+\\.[0-9]+$')
        fail_msg: "Could not determine an exact Ceph client version from: {{ ceph_client_version.stdout | default('') }}"

    - name: Set the exact Ceph container image
      set_fact:
        ceph_image: "{{ ceph_image_registry }}:v{{ ceph_version }}"

    - name: Verify the exact Ceph client image on all managed hosts
      command: >-
        cephadm --image {{ ceph_image }} shell -- ceph --version
      delegate_to: "{{ item }}"
      loop: "{{ (groups['deployment_nodes'] + groups['deployment_controller']) | unique }}"
      register: ceph_client_versions
      changed_when: false

    - name: Require every managed host to use the resolved Ceph version
      ansible.builtin.assert:
        that:
          - client_version.stdout is search('version ' ~ ceph_version ~ ' ')
        fail_msg: >-
          Ceph container client version mismatch on {{ client_version.item }}:
          expected {{ ceph_version }}, got {{ client_version.stdout | default('') }}
      loop: "{{ ceph_client_versions.results }}"
      loop_control:
        loop_var: client_version

    - name: Use the exact Ceph image for all Ceph client operations
      set_fact:
        ceph_cli: "timeout 120s cephadm --image {{ ceph_image }} shell -- ceph"

    - name: Add initial-ceph.conf
      copy: 
        dest: /etc/ceph/initial-ceph.conf
        content: |
          [global]
          osd_pool_default_size = {{ storage_ceph_default_pool_size }}
          osd_pool_default_min_size = {{ storage_ceph_default_min_pool_size }}
          bdev_enable_discard = {{ storage_ceph_osd_discard | default(false) | bool | ternary('true', 'false') }}
          {% if storage_ceph_no_redundancy_warning | default(false) | bool %}
          mon_warn_on_pool_no_redundancy = false
          {% endif %}

          public_network = {{ network_ceph_public_ip | ansible.utils.ipaddr('network/prefix') }}
          cluster_network = {{ network_ceph_public_ip | ansible.utils.ipaddr('network/prefix') }}

    - name: Run cephadm bootstrap
      command: >-
        cephadm --image {{ ceph_image }} bootstrap
        --config /etc/ceph/initial-ceph.conf
        --allow-overwrite
        --mon-ip {{ network_ceph_public_ip | ansible.utils.ipaddr('address') }}
        --skip-monitoring-stack
      args:
        creates: /etc/ceph/ceph.client.admin.keyring
      register: cephadm_bootstrap

    - name: Read existing Ceph daemon versions
      command: "{{ ceph_cli }} orch ps --format json"
      when: not cephadm_bootstrap.changed
      register: ceph_daemons
      changed_when: false

    - name: Collect existing Ceph daemon versions
      set_fact:
        ceph_daemon_versions: "{{ (ceph_daemons.stdout | from_json | map(attribute='version') | list | unique) if ceph_daemons.rc == 0 else [] }}"
        ceph_mgr_count: "{{ (ceph_daemons.stdout | from_json | selectattr('daemon_type', 'equalto', 'mgr') | list | length) if ceph_daemons.rc == 0 else 0 }}"
      when: not cephadm_bootstrap.changed

    - name: Prevent unsupported single-manager automatic upgrades
      ansible.builtin.assert:
        that:
          - ceph_daemon_versions == [ceph_version] or (ceph_mgr_count | int) >= 2
        fail_msg: >-
          Ceph daemons need an upgrade to {{ ceph_version }}, but the cluster has
          fewer than two managers. Add a standby manager before rerunning ceph-up.
      when: not cephadm_bootstrap.changed

    - name: Upgrade existing Ceph daemons to the client version
      command: "{{ ceph_cli }} orch upgrade start --image {{ ceph_image }}"
      when:
        - not cephadm_bootstrap.changed
        - ceph_daemon_versions != [ceph_version]
      register: cephadm_upgrade
      changed_when: cephadm_upgrade.rc == 0

    - name: Display Ceph upgrade status
      command: "{{ ceph_cli }} orch upgrade status"
      when:
        - not cephadm_bootstrap.changed
        - ceph_daemon_versions != [ceph_version]
      changed_when: false
      register: cephadm_upgrade_status

    - name: Verify the Ceph client can read the admin keyring
      command: "{{ ceph_cli }} -n client.admin auth ls"
      changed_when: false

    - name: Read the current Ceph cluster FSID
      command: "{{ ceph_cli }} fsid"
      register: ceph_cluster_fsid
      changed_when: false

    - name: Disable the no-redundancy warning for development Ceph pools
      command: "{{ ceph_cli }} config set mon mon_warn_on_pool_no_redundancy false"
      changed_when: false
      when: storage_ceph_no_redundancy_warning | default(false) | bool

    - name: Get cephadm ssh public key
      command: "{{ ceph_cli }} cephadm get-pub-key"
      register: cephadm_pub_key
      changed_when: false

    - name: Add cephadm public key
      authorized_key:
        user: root
        key: "{{ cephadm_pub_key.stdout }}"
        manage_dir: no
      delegate_to: "{{ item }}"
      loop: "{{ groups['deployment_nodes'] }}"

    - name: Add hosts
      command: "{{ ceph_cli }} orch host add {{ item }} {{ item }} --labels _admin"
      loop: "{{ groups['deployment_nodes'] }}"

    - name: Apply mons placement
      command: "{{ ceph_cli }} orch apply mon --placement='{% for host in groups['deployment_nodes'] %}{{ host }},{% endfor %}'"

    - name: Add (other) mons
      command: "{{ ceph_cli }} orch daemon add mon {{ item }}"
      loop: "{{ groups['deployment_nodes'] }}"
      when: item != groups['deployment_nodes'][0]
      failed_when: false

    - pause:
        seconds: 10

    - name: Get ceph status output
      command: "{{ ceph_cli }} status -f json-pretty"
      register: ceph_status

    - name: Fail if not all mons added
      fail:
        msg: There are {{ (ceph_status.stdout | from_json).monmap.num_mons }} mons but expected number of mons is {{ groups['deployment_nodes'] | length }}
      when: (ceph_status.stdout | from_json).monmap.num_mons != groups['deployment_nodes'] | length
      
      # Note: This is supposed to happen automatically with _admin label
    - name: Generate new minimal ceph.conf
      command: "{{ ceph_cli }} config generate-minimal-conf"
      register: ceph_conf

    - name: Write new ceph.conf
      copy:
        content: "{{ ceph_conf.stdout }}\n"
        dest: /etc/ceph/ceph.conf
      loop: "{{ groups['deployment_nodes'] + groups['deployment_controller'] }}"
      delegate_to: "{{ item }}"

    - name: Get ceph admin keyring
      command: "{{ ceph_cli }} auth get client.admin"
      register: ceph_keyring

    - name: Write ceph admin keyring
      copy:
        content: "{{ ceph_keyring.stdout }}\n"
        dest: /etc/ceph/ceph.client.admin.keyring
      loop: "{{ groups['deployment_nodes'] + groups['deployment_controller'] }}"
      delegate_to: "{{ item }}"

    - name: Configure BlueStore OSD discard
      command: >-
        {{ ceph_cli }} config set osd bdev_enable_discard
        {{ storage_ceph_osd_discard | bool | ternary('true', 'false') }}
      when: storage_ceph_osd_discard is defined

    # run ceph-volume from mon containers
    - name: Zap osds
      shell: |
        set -e
        {% for device in storage_ceph_osd_devices -%}
          docker exec $(docker ps | grep ceph-.*-mon | awk '{print $1}') \
            bash -c "ceph-volume lvm zap {{ device }}"
        {% endfor %}
      delegate_to: "{{ item }}"
      loop: "{{ groups['deployment_nodes'] }}"
      when: cephadm_bootstrap.changed

    - name: Get number osds present
      shell: "{{ ceph_cli }} osd tree | grep osd. | wc -l"
      register: ceph_osd_count

    - name: Calculate expected osd devices
      set_fact:
        expected_osd_devices: "{{ (expected_osd_device | default(0) | int) + (hostvars[item].storage_ceph_osd_devices | length) }}"
      loop: "{{ groups['deployment_nodes'] }}"

    - name: Reject OSD devices owned by a different Ceph cluster
      shell: |
        set -e
        for device in {{ storage_ceph_osd_devices | join(' ') }}; do
          tags=$(lvs --noheadings --options lv_tags "$device" 2>/dev/null || true)
          foreign_fsid=$(printf '%s\n' "$tags" | tr ',' '\n' | sed -n 's/^[[:space:]]*ceph.cluster_fsid=//p' | head -n 1)
          if [ -n "$foreign_fsid" ] && [ "$foreign_fsid" != "{{ ceph_cluster_fsid.stdout | trim }}" ]; then
            echo "$device belongs to Ceph cluster $foreign_fsid, current cluster is {{ ceph_cluster_fsid.stdout | trim }}" >&2
            exit 1
          fi
        done
      changed_when: false
      when:
        - storage_ceph_osd_devices | length > 0
        - not cephadm_bootstrap.changed

    - name: Add osds
      shell: |
        set -e
        {% for device in storage_ceph_osd_devices -%}
          {{ ceph_cli }} orch daemon add osd {{ item }}:{{ device }}
        {% endfor %}
      loop: "{{ groups['deployment_nodes'] }}"
      when: (ceph_osd_count.stdout | int) < (expected_osd_devices | int)

    - name: Wait for configured OSDs to be up and in
      command: "{{ ceph_cli }} osd stat -f json"
      register: ceph_osd_stat
      changed_when: false
      retries: 30
      delay: 10
      until: >-
        ceph_osd_stat.rc == 0 and
        (ceph_osd_stat.stdout | from_json).num_up_osds | int >= expected_osd_devices | int and
        (ceph_osd_stat.stdout | from_json).num_in_osds | int >= expected_osd_devices | int
      when: expected_osd_devices | int > 0

    - name: Read the existing RGW daemon state
      command: "{{ ceph_cli }} orch ps --service_name rgw.foo --format json"
      register: ceph_existing_rgw_daemons
      changed_when: false
      failed_when: false

    - name: Determine whether RGW needs a fresh port check
      set_fact:
        ceph_rgw_running: >-
          {{ ceph_existing_rgw_daemons.rc == 0 and
             ((ceph_existing_rgw_daemons.stdout | default('[]', true) | from_json |
               selectattr('status_desc', 'equalto', 'running') | list | length) > 0) }}

    - name: Check whether the local Kolla HAProxy service is running
      command: systemctl is-active --quiet kolla-haproxy-container.service
      register: ceph_haproxy_state
      changed_when: false
      failed_when: false
      when: not ceph_rgw_running

    - name: Temporarily stop HAProxy for the initial RGW port check
      ansible.builtin.systemd:
        name: kolla-haproxy-container.service
        state: stopped
      register: ceph_haproxy_stop
      when:
        - not ceph_rgw_running
        - ceph_haproxy_state.rc == 0

    - name: Create rgw config file
      copy:
        dest: /tmp/rgw.yml
        content: |
          service_type: rgw
          service_id: foo
          placement:
            label: _admin
            count_per_host: 1
          networks:
          - {{ network_ceph_public_ip | ansible.utils.ipaddr('network') }}/{{ network_ceph_public_ip | ansible.utils.ipaddr('prefix') }}
          spec:
            rgw_frontend_type: beast
            rgw_frontend_port: {{ ceph_rgw_frontend_port }}

    - name: Deploy RGW on the Ceph public network
      block:
        - name: Add rgw
          command: >-
            cephadm --image {{ ceph_image }} shell
            --mount /tmp/rgw.yml
            -- ceph orch apply -i /mnt/rgw.yml

        - name: Wait for RGW to run on the Ceph public network
          command: "{{ ceph_cli }} orch ps --service_name rgw.foo --format json"
          register: ceph_rgw_daemons
          changed_when: false
          retries: 30
          delay: 5
          until:
            - ceph_rgw_daemons.rc == 0
            - (ceph_rgw_daemons.stdout | from_json | selectattr('status_desc', 'equalto', 'running') | list | length) > 0

        - name: Verify RGW listens on the Ceph public address
          shell: >-
            ss -ltnH '( sport = :{{ ceph_rgw_frontend_port }} )' |
            awk '{print $4}' |
            grep -Fx '{{ network_ceph_public_ip | ansible.utils.ipaddr('address') }}:{{ ceph_rgw_frontend_port }}'
          register: ceph_rgw_listener
          changed_when: false
          retries: 12
          delay: 5
          until: ceph_rgw_listener.rc == 0
      always:
        - name: Restore HAProxy after the RGW port check
          ansible.builtin.systemd:
            name: kolla-haproxy-container.service
            state: started
          when: ceph_haproxy_stop.changed | default(false)

    - name: Enable ceph-exporter
      command: "{{ ceph_cli }} mgr module enable prometheus"

    - name: Add pools
      script: "{{ playbook_dir }}/../scripts/cephadm/pools.sh"
      args:
        creates: /root/cephadm_pools.done
      run_once: true
      environment:
        CEPHADM_IMAGE: "{{ ceph_image }}"

      # need default 8443 on node for nova console proxy. Only possibility on the same dns host if ur using cloudflare
    - name: Change mgr dashboard port
      shell: |
        {{ ceph_cli }} config set mgr mgr/dashboard/ssl_server_port 8444 && docker ps --format '{% raw %}{{ .Names }}{% endraw %}' | grep ceph | grep mgr- | xargs docker restart

- name: Destroy cephadm cluster
  hosts: deployment_nodes[0]
  any_errors_fatal: true
  tags:
    - destroy
    - never
  tasks:
    - name: Destroy cephadm
      script: "{{ playbook_dir }}/../scripts/cephadm/destroy.sh"

- name: Destroy cephadm cluster
  hosts: deployment_nodes
  tags:
    - destroy
    - never
  tasks:
    - name: Disable ceph daemons
      shell:
        systemctl stop ceph*;
        systemctl disable ceph*;
        systemctl daemon-reload;
        rm -rf /etc/systemd/system/ceph*;
        rm -rf /etc/ceph;
        rm -rf /var/lib/ceph;
        rm -rf /var/log/ceph;
        docker rm -f $(docker ps -a | grep ceph | awk '{print $1}');
      failed_when: false
