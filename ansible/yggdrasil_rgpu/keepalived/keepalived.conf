global_defs {
  router_id YGGDRASIL_RGPU_PROXY_aio
}

vrrp_script check_rgpu_forwarder {
  script "/usr/bin/curl -fsS http://127.0.0.1:9995/healthz"
  interval 2
  timeout 2
  fall 2
  rise 2
  weight 0
}

vrrp_instance VI_RGPU_PROXY {
  state BACKUP
  interface openstack_mgmt
  virtual_router_id 52
  priority 150
  advert_int 1
  authentication {
    auth_type PASS
    auth_pass c5efe819
  }
  virtual_ipaddress {
    10.0.10.200/32 dev openstack_mgmt
  }
  track_script {
    check_rgpu_forwarder
  }
}
