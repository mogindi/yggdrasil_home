---
- name: Setup Trove
  hosts: deployment_controller
  any_errors_fatal: true
  tasks:
    - name: Setup Trove
      shell: |
        #!/bin/bash

        set -xe

        deployment_workspace="${TROVE_WORKSPACE:-}"
        if [[ -n "$deployment_workspace" ]]; then
          workspace_candidates=("$deployment_workspace")
        else
          workspace_candidates=(workspace /root/yggdrasil_home/workspace /workspace*/yggdrasil_home/workspace)
        fi

        deployment_workspace=""
        for candidate in "${workspace_candidates[@]}"; do
          if [[ -f "$candidate/kolla-venv/bin/activate" && -f "$candidate/etc/kolla/admin-openrc.sh" ]]; then
            deployment_workspace="$candidate"
            break
          fi
        done

        if [[ -z "$deployment_workspace" ]]; then
          echo "Could not find a Kolla workspace; set TROVE_WORKSPACE to its path" >&2
          exit 1
        fi

        echo "Using Trove workspace: $deployment_workspace"
        cd "$deployment_workspace"
        source kolla-venv/bin/activate

        CONFIG_DIR=$(pwd)/etc/kolla

        # source admin rc
        . $CONFIG_DIR/admin-openrc.sh

        source "{{ playbook_dir }}/../../scripts/openstack/image-utils.sh"

        image=trove-master-guest-ubuntu-noble

        commands="sed -i \
        -e '/LOG.info(f\"Creating database {database.name}\")/a\' \
        -e '        database.collate = \"en_US.utf8\"' \
        /opt/guest-agent-venv/lib/python3.12/site-packages/trove/guestagent/datastore/postgres/service.py"

        create_openstack_linux_image https://tarballs.opendev.org/openstack/trove/images/$image.qcow2 \
          $image \
          "$commands" \
          "--property hw_rng_model=virtio"

        image_name=$image
        mongodb_image_name="${TROVE_MONGODB_GUEST_IMAGE_NAME:-trove-master-guest-ubuntu-noble-mongodb}"
        mongodb_version="${TROVE_MONGODB_VERSION:-8.0}"
        mongodb_repl_strategy="${TROVE_MONGODB_REPL_STRATEGY:-none}"
        mongodb_config_rules="/tmp/trove-mongodb-validation-rules.json"
        docker cp "{{ playbook_dir }}/../../scripts/openstack/trove-mongodb/validation-rules.json" \
            "trove_taskmanager:$mongodb_config_rules"

        openstack image set --private  \
            --tag trove --tag postgres --tag mysql $image_name

        openstack keypair show --user trove testkey || openstack keypair create --public-key ~/.ssh/id_rsa.pub --user trove testkey

        openstack datastore version show --datastore postgresql 17 || openstack datastore version create 17 postgresql postgresql "" \
            --image-tags trove,postgres \
            --active --default

        openstack datastore version show --datastore mysql 8.4 || openstack datastore version create 8.4 mysql mysql "" \
            --image-tags trove,mysql \
            --active --default

        if openstack image show "$mongodb_image_name" >/dev/null 2>&1; then
            openstack image set --private --tag trove --tag mongodb "$mongodb_image_name"
            openstack datastore version show --datastore mongodb "$mongodb_version" || openstack datastore version create "$mongodb_version" mongodb mongodb "" \
                --image-tags trove,mongodb \
                --repl-strategy "$mongodb_repl_strategy" \
                --active --default
            docker exec trove_taskmanager trove-manage \
                db_remove_datastore_config_parameters mongodb "$mongodb_version"
            docker exec trove_taskmanager trove-manage \
                db_load_datastore_config_parameters mongodb "$mongodb_version" \
                "$mongodb_config_rules"
        else
            echo "MongoDB guest image is not uploaded; run make openstack-trove-mongodb-image to enable MongoDB"
        fi

      args:
        chdir: "{{ playbook_dir }}/../.."
        executable: /bin/bash

- name: Test Trove
  hosts: deployment_controller
  any_errors_fatal: true
  tasks:
    - name: Create test Trove cluster
      shell: |
        #!/bin/bash

        set -xe

        deployment_workspace="${TROVE_WORKSPACE:-}"
        if [[ -n "$deployment_workspace" ]]; then
          workspace_candidates=("$deployment_workspace")
        else
          workspace_candidates=(workspace /root/yggdrasil_home/workspace /workspace*/yggdrasil_home/workspace)
        fi

        deployment_workspace=""
        for candidate in "${workspace_candidates[@]}"; do
          if [[ -f "$candidate/kolla-venv/bin/activate" && -f "$candidate/etc/kolla/admin-openrc.sh" ]]; then
            deployment_workspace="$candidate"
            break
          fi
        done

        if [[ -z "$deployment_workspace" ]]; then
          echo "Could not find a Kolla workspace; set TROVE_WORKSPACE to its path" >&2
          exit 1
        fi

        echo "Using Trove workspace: $deployment_workspace"
        cd "$deployment_workspace"
        source kolla-venv/bin/activate

        CONFIG_DIR=$(pwd)/etc/kolla

        # source admin rc
        . $CONFIG_DIR/admin-openrc.sh

        mongodb_version="${TROVE_MONGODB_VERSION:-8.0}"
        mongodb_image_name="${TROVE_MONGODB_GUEST_IMAGE_NAME:-trove-master-guest-ubuntu-noble-mongodb}"
        if openstack image show "$mongodb_image_name" >/dev/null 2>&1; then
            openstack datastore version show --datastore mongodb "$mongodb_version"
        else
            echo "MongoDB guest image is not uploaded; skipping MongoDB datastore validation"
        fi

        suffix=$RANDOM
        name=test-postgresql-$suffix
      
        openstack database instance create $name \
            --flavor m1.medium \
            --size 5 \
            --nic net-id=$(openstack network show demo-net -f value -c id) \
            --databases test --users userA:password \
            --datastore postgresql --datastore-version 17 \
            --replica-count 1 \
            --is-public \
            --allowed-cidr 0.0.0.0/0

        sleep 60

        set +x

        timeout_seconds=300
        sleep_time=10
        ready_status=ACTIVE
        wip_status=BUILD
        time=0
        while true; do
          status=$(openstack database instance show $name -f value -c status)
          if [[ $time -gt $timeout_seconds ]]; then
            echo Timeout reached - exiting
            exit 1
          elif echo $status | grep -q $ready_status; then
            echo Now available
            break
          elif echo $status | grep -qv $wip_status ; then
            echo Unexpected status
            exit 1
          fi
          echo Trove: Waiting for resource...
          time=$(( $time + $sleep_time ))
          sleep $sleep_time
        done

        echo Deleting instance...

        openstack database instance delete $name
      args:
        chdir: "{{ playbook_dir }}/../.."
        executable: /bin/bash
