---
- name: Test Trove MongoDB
  hosts: deployment_controller
  any_errors_fatal: true
  tasks:
    - name: Create and exercise a MongoDB Trove instance
      shell: |
        #!/bin/bash

        set -xe

        deployment_workspace="${TROVE_WORKSPACE:-}"
        if [[ -n "$deployment_workspace" ]]; then
          workspace_candidates=("$deployment_workspace")
        else
          workspace_candidates=(workspace /root/yggdrasil_home/workspace /workspace*/yggdrasil_home/workspace)
        fi

        deployment_workspace=""
        for candidate in "${workspace_candidates[@]}"; do
          if [[ -f "$candidate/kolla-venv/bin/activate" && -f "$candidate/etc/kolla/admin-openrc.sh" ]]; then
            deployment_workspace="$candidate"
            break
          fi
        done

        if [[ -z "$deployment_workspace" ]]; then
          echo "Could not find a Kolla workspace; set TROVE_WORKSPACE to its path" >&2
          exit 1
        fi

        echo "Using Trove workspace: $deployment_workspace"
        cd "$deployment_workspace"
        source kolla-venv/bin/activate

        CONFIG_DIR=$(pwd)/etc/kolla
        . $CONFIG_DIR/admin-openrc.sh

        mongodb_version="${TROVE_MONGODB_VERSION:-8.0}"
        mongodb_image_name="${TROVE_MONGODB_GUEST_IMAGE_NAME:-trove-master-guest-ubuntu-noble-mongodb}"
        mongodb_flavor="${TROVE_MONGODB_TEST_FLAVOR:-m1.small}"
        openstack_timeout=60
        config_name=""
        config_id=""

        timeout "$openstack_timeout" openstack token issue -f value -c id >/dev/null
        timeout "$openstack_timeout" openstack image show "$mongodb_image_name" >/dev/null
        timeout "$openstack_timeout" openstack datastore version show --datastore mongodb "$mongodb_version" >/dev/null
        compute_services=$(timeout "$openstack_timeout" openstack compute service list -f value -c Binary -c Host -c State -c Status)
        if ! awk '$1 == "nova-scheduler" && $4 == "up" {found=1} END {exit !found}' <<< "$compute_services"; then
          printf '%s\n' "$compute_services"
          echo "Nova scheduler is not reporting up; cannot create a Trove test instance" >&2
          exit 1
        fi
        if ! awk '$1 == "nova-compute" && $4 == "up" {found=1} END {exit !found}' <<< "$compute_services"; then
          printf '%s\n' "$compute_services"
          echo "Nova compute is not reporting up; cannot create a Trove test instance" >&2
          exit 1
        fi
        timeout "$openstack_timeout" openstack flavor show "$mongodb_flavor" >/dev/null

        network_id=$(timeout "$openstack_timeout" openstack network show demo-net -f value -c id)
        suffix=$RANDOM
        name=test-mongodb-$suffix
        timeout_seconds=600
        sleep_time=10

        delete_instance() {
          timeout "$openstack_timeout" openstack database instance delete "$name" >/dev/null 2>&1 || \
            timeout "$openstack_timeout" openstack database instance force delete "$name" >/dev/null 2>&1
        }

        cleanup() {
          set +e
          delete_instance
        }
        trap cleanup EXIT

        wait_for_healthy() {
          local resource="${1:-$name}"
          local started_at
          local elapsed
          local details
          local status
          local operating_status
          started_at=$(date +%s)

          while true; do
            if details=$(timeout 45 openstack database instance show "$resource" -f yaml 2>/dev/null); then
              status=$(awk -F': ' '$1 == "status" {print $2}' <<< "$details")
              operating_status=$(awk -F': ' '$1 == "operating_status" {print $2}' <<< "$details")

              if [[ "$status" == "ERROR" || "$operating_status" == "ERROR" || "$operating_status" == "FAILED" ]]; then
                printf '%s\n' "$details"
                echo "MongoDB Trove instance entered an error state" >&2
                return 1
              fi

              if [[ "$status" == "ACTIVE" && "$operating_status" == "HEALTHY" ]]; then
                return 0
              fi

              echo "Trove MongoDB ($resource): status=$status operating_status=$operating_status"
            else
              echo "Trove API unavailable while waiting for MongoDB instance" >&2
            fi

            elapsed=$(( $(date +%s) - started_at ))
            if [[ $elapsed -ge $timeout_seconds ]]; then
              timeout "$openstack_timeout" openstack database instance show "$resource" || true
              echo "Timed out waiting for MongoDB Trove instance to become healthy" >&2
              return 1
            fi

            sleep "$sleep_time"
          done
        }

        timeout 120 openstack database instance create "$name" \
            --flavor "$mongodb_flavor" \
            --size 5 \
            --nic net-id="$network_id" \
            --datastore mongodb \
            --datastore-version "$mongodb_version" \
            --replica-count 1 \
            --is-public \
            --allowed-cidr 0.0.0.0/0

        wait_for_healthy "$name"

        addresses=$(timeout "$openstack_timeout" openstack database instance show "$name" -f value -c ip)
        if [[ -z "$addresses" || "$addresses" == "None" ]]; then
          timeout "$openstack_timeout" openstack database instance show "$name" || true
          echo "MongoDB Trove instance did not expose an IP address" >&2
          exit 1
        fi

        check_mongodb_port() {
          local ip
          local normalized_addresses="${addresses//,/ }"

          for ip in $normalized_addresses; do
            if [[ "$ip" != "None" ]] && timeout 10 bash -c ": </dev/tcp/$ip/27017"; then
              echo "MongoDB is reachable at $ip:27017"
              return 0
            fi
          done

          echo "MongoDB was not reachable at any advertised address: $addresses" >&2
          return 1
        }

        check_mongodb_port

        timeout 120 openstack database instance restart "$name"
        wait_for_healthy "$name"
        addresses=$(timeout "$openstack_timeout" openstack database instance show "$name" -f value -c ip)
        check_mongodb_port

        delete_instance
        trap - EXIT

        timeout "$openstack_timeout" openstack database configuration parameter show \
            --datastore mongodb "$mongodb_version" systemLog.verbosity >/dev/null

        config_name="test-mongodb-config-$suffix"
        config_id=$(timeout 120 openstack database configuration create \
            "$config_name" '{"systemLog.verbosity": 1}' \
            --datastore mongodb --datastore-version "$mongodb_version" \
            -f value -c id)

        cluster_name="test-mongodb-cluster-$suffix"
        cluster_instance="flavor=$mongodb_flavor,volume=5,nic=net-id=$network_id"

        delete_cluster() {
          timeout "$openstack_timeout" openstack database cluster delete \
              "$cluster_name" >/dev/null 2>&1 || \
            timeout "$openstack_timeout" openstack database cluster force delete \
              "$cluster_name" >/dev/null 2>&1
        }

        delete_config() {
          local attempts=0
          while [[ $attempts -lt 12 ]]; do
            if timeout "$openstack_timeout" openstack database configuration delete \
                "$config_id" >/dev/null 2>&1; then
              return 0
            fi
            attempts=$((attempts + 1))
            sleep 5
          done
          echo "Unable to delete MongoDB test configuration $config_id" >&2
          return 1
        }

        cleanup_cluster() {
          set +e
          delete_cluster
          if [[ -n "$config_id" ]]; then
            delete_config
          fi
        }
        trap cleanup_cluster EXIT

        wait_for_cluster() {
          local expected_count="$1"
          local started_at
          local elapsed
          local details
          local task_name
          local instance_ids
          local instance_id
          started_at=$(date +%s)

          while true; do
            if details=$(timeout 45 openstack database cluster show \
                "$cluster_name" -f json 2>/dev/null); then
              task_name=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["cluster"]["task"]["name"])' <<< "$details")
              if [[ "$task_name" == *ERROR* ]]; then
                printf '%s\n' "$details"
                echo "MongoDB Trove cluster entered an error task: $task_name" >&2
                return 1
              fi
              if [[ "$task_name" == "NONE" ]]; then
                instance_ids=$(timeout 45 openstack database cluster list instances \
                    "$cluster_name" -f value -c id)
                if [[ $(wc -w <<< "$instance_ids") -eq "$expected_count" ]]; then
                  for instance_id in $instance_ids; do
                    wait_for_healthy "$instance_id"
                  done
                  return 0
                fi
                echo "Trove MongoDB cluster has $(wc -w <<< "$instance_ids")/$expected_count members"
              else
                echo "Trove MongoDB cluster task=$task_name"
              fi
            else
              echo "Trove API unavailable while waiting for MongoDB cluster" >&2
            fi

            elapsed=$(( $(date +%s) - started_at ))
            if [[ $elapsed -ge $timeout_seconds ]]; then
              timeout "$openstack_timeout" openstack database cluster show \
                "$cluster_name" || true
              echo "Timed out waiting for MongoDB Trove cluster" >&2
              return 1
            fi
            sleep "$sleep_time"
          done
        }

        timeout 120 openstack database cluster create "$cluster_name" \
            mongodb "$mongodb_version" \
            --instance "$cluster_instance" \
            --instance "$cluster_instance" \
            --configuration "$config_id"

        wait_for_cluster 2

        timeout 120 openstack database configuration set "$config_id" \
            '{"systemLog.verbosity": 2}' >/dev/null
        wait_for_cluster 2

        timeout 120 openstack database cluster grow "$cluster_name" \
            --instance "$cluster_instance"
        wait_for_cluster 3

        cluster_instance_ids=($(timeout 45 openstack database cluster list instances \
            "$cluster_name" -f value -c id))
        cluster_instance_count=$(printf '%s\n' "${cluster_instance_ids[@]}" | awk 'NF {count++} END {print count+0}')
        if [[ $cluster_instance_count -ne 3 ]]; then
          echo "Expected three MongoDB cluster instances before shrink" >&2
          exit 1
        fi
        timeout 120 openstack database cluster shrink "$cluster_name" \
            "${cluster_instance_ids[0]}"
        wait_for_cluster 2

        # Keep the configuration group for the sharded-cluster exercise, but
        # remove the replica-set cluster before allocating the larger topology.
        old_cluster_name="$cluster_name"
        delete_cluster
        for delete_attempt in $(seq 1 60); do
          if ! timeout 45 openstack database cluster show \
              "$old_cluster_name" >/dev/null 2>&1; then
            break
          fi
          sleep 5
        done
        if timeout 45 openstack database cluster show \
            "$old_cluster_name" >/dev/null 2>&1; then
          echo "Timed out waiting for the replica-set test cluster deletion" >&2
          exit 1
        fi
        cluster_name="test-mongodb-sharded-$suffix"
        sharded_instance="flavor=$mongodb_flavor,volume=5,nic=net-id=$network_id"
        timeout 120 openstack database cluster create "$cluster_name" \
            mongodb "$mongodb_version" \
            --instance "$sharded_instance" \
            --instance "$sharded_instance" \
            --extended-properties topology=sharded,num_configsvr=2,num_mongos=1 \
            --configuration "$config_id"

        # The public cluster view exposes shard members and routers; config
        # servers remain management-only.  That is 3 visible nodes initially.
        wait_for_cluster 3

        shard_member_a="${cluster_name}-new-shard-a"
        shard_member_b="${cluster_name}-new-shard-b"
        timeout 120 openstack database cluster grow "$cluster_name" \
            --instance "${sharded_instance},type=replica,name=$shard_member_a" \
            --instance "${sharded_instance},type=replica,name=$shard_member_b,related_to=$shard_member_a"
        wait_for_cluster 5

        timeout 120 openstack database cluster grow "$cluster_name" \
            --instance "${sharded_instance},type=query_router"
        wait_for_cluster 6

        sharded_instances=$(timeout 45 openstack database cluster show \
            "$cluster_name" -f json)
        shard_ids=($(python3 -c 'import json,sys; data=json.load(sys.stdin)["cluster"]["instances"]; print("\n".join(sorted({item["shard_id"] for item in data if item.get("type") == "member" and item.get("shard_id")})))' <<< "$sharded_instances"))
        shard_count=$(printf '%s\n' "${shard_ids[@]}" | awk 'NF {count++} END {print count+0}')
        if [[ $shard_count -ne 2 ]]; then
          printf '%s\n' "$sharded_instances"
          echo "Expected two MongoDB shards" >&2
          exit 1
        fi
        second_shard_members=($(python3 -c 'import json,sys; data=json.load(sys.stdin)["cluster"]["instances"]; shard=sys.argv[1]; print("\n".join(item["id"] for item in data if item.get("type") == "member" and item.get("shard_id") == shard))' "${shard_ids[1]}" <<< "$sharded_instances"))
        second_shard_member_count=$(printf '%s\n' "${second_shard_members[@]}" | awk 'NF {count++} END {print count+0}')
        if [[ $second_shard_member_count -ne 2 ]]; then
          printf '%s\n' "$sharded_instances"
          echo "Expected the added MongoDB shard to have two members" >&2
          exit 1
        fi
        timeout 120 openstack database cluster shrink "$cluster_name" \
            "${second_shard_members[@]}"
        wait_for_cluster 4

        cleanup_cluster
        trap - EXIT
      args:
        chdir: "{{ playbook_dir }}/../.."
        executable: /bin/bash
