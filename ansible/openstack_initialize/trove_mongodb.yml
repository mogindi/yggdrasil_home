---
- name: Test Trove MongoDB
  hosts: deployment_controller
  any_errors_fatal: true
  tasks:
    - name: Create and exercise a MongoDB Trove instance
      shell: |
        #!/bin/bash

        set -xe

        cd workspace
        source kolla-venv/bin/activate

        CONFIG_DIR=$(pwd)/etc/kolla
        . $CONFIG_DIR/admin-openrc.sh

        mongodb_version="${TROVE_MONGODB_VERSION:-8.0}"
        mongodb_image_name="${TROVE_MONGODB_GUEST_IMAGE_NAME:-trove-master-guest-ubuntu-noble-mongodb}"

        openstack image show "$mongodb_image_name" >/dev/null
        openstack datastore version show --datastore mongodb "$mongodb_version" >/dev/null

        network_id=$(openstack network show demo-net -f value -c id)
        suffix=$RANDOM
        name=test-mongodb-$suffix
        timeout_seconds=600
        sleep_time=10

        cleanup() {
          set +e
          openstack database instance delete "$name" >/dev/null 2>&1
        }
        trap cleanup EXIT

        wait_for_healthy() {
          local elapsed=0
          local status
          local operating_status

          while true; do
            status=$(openstack database instance show "$name" -f value -c status 2>/dev/null || true)
            operating_status=$(openstack database instance show "$name" -f value -c operating_status 2>/dev/null || true)

            if [[ "$status" == "ERROR" || "$operating_status" == "ERROR" || "$operating_status" == "FAILED" ]]; then
              openstack database instance show "$name" || true
              echo "MongoDB Trove instance entered an error state" >&2
              return 1
            fi

            if [[ "$status" == "ACTIVE" && "$operating_status" == "HEALTHY" ]]; then
              return 0
            fi

            if [[ $elapsed -ge $timeout_seconds ]]; then
              openstack database instance show "$name" || true
              echo "Timed out waiting for MongoDB Trove instance to become healthy" >&2
              return 1
            fi

            echo "Trove MongoDB: status=$status operating_status=$operating_status"
            sleep "$sleep_time"
            elapsed=$((elapsed + sleep_time))
          done
        }

        openstack database instance create "$name" \
            --flavor m1.medium \
            --size 5 \
            --nic net-id="$network_id" \
            --datastore mongodb \
            --datastore-version "$mongodb_version" \
            --replica-count 1 \
            --is-public \
            --allowed-cidr 0.0.0.0/0

        wait_for_healthy

        addresses=$(openstack database instance show "$name" -f value -c ip)
        if [[ -z "$addresses" || "$addresses" == "None" ]]; then
          openstack database instance show "$name"
          echo "MongoDB Trove instance did not expose an IP address" >&2
          exit 1
        fi

        check_mongodb_port() {
          local ip
          local normalized_addresses="${addresses//,/ }"

          for ip in $normalized_addresses; do
            if [[ "$ip" != "None" ]] && timeout 10 bash -c ": </dev/tcp/$ip/27017"; then
              echo "MongoDB is reachable at $ip:27017"
              return 0
            fi
          done

          echo "MongoDB was not reachable at any advertised address: $addresses" >&2
          return 1
        }

        check_mongodb_port

        openstack database instance restart "$name"
        wait_for_healthy
        addresses=$(openstack database instance show "$name" -f value -c ip)
        check_mongodb_port

        trap - EXIT
        openstack database instance delete "$name"
      args:
        chdir: "{{ playbook_dir }}/../.."
        executable: /bin/bash
