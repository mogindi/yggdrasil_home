---
- name: Test Trove MongoDB
  hosts: deployment_controller
  any_errors_fatal: true
  tasks:
    - name: Create and exercise a MongoDB Trove instance
      shell: |
        #!/bin/bash

        set -xe

        deployment_workspace="${TROVE_WORKSPACE:-}"
        if [[ -n "$deployment_workspace" ]]; then
          workspace_candidates=("$deployment_workspace")
        else
          workspace_candidates=(workspace /root/yggdrasil_home/workspace /workspace*/yggdrasil_home/workspace)
        fi

        deployment_workspace=""
        for candidate in "${workspace_candidates[@]}"; do
          if [[ -f "$candidate/kolla-venv/bin/activate" && -f "$candidate/etc/kolla/admin-openrc.sh" ]]; then
            deployment_workspace="$candidate"
            break
          fi
        done

        if [[ -z "$deployment_workspace" ]]; then
          echo "Could not find a Kolla workspace; set TROVE_WORKSPACE to its path" >&2
          exit 1
        fi

        echo "Using Trove workspace: $deployment_workspace"
        cd "$deployment_workspace"
        source kolla-venv/bin/activate

        CONFIG_DIR=$(pwd)/etc/kolla
        . $CONFIG_DIR/admin-openrc.sh

        mongodb_version="${TROVE_MONGODB_VERSION:-8.0}"
        mongodb_image_name="${TROVE_MONGODB_GUEST_IMAGE_NAME:-trove-master-guest-ubuntu-noble-mongodb}"
        mongodb_flavor="${TROVE_MONGODB_TEST_FLAVOR:-m1.small}"
        openstack_timeout=60

        timeout "$openstack_timeout" openstack token issue -f value -c id >/dev/null
        timeout "$openstack_timeout" openstack image show "$mongodb_image_name" >/dev/null
        timeout "$openstack_timeout" openstack datastore version show --datastore mongodb "$mongodb_version" >/dev/null
        compute_services=$(timeout "$openstack_timeout" openstack compute service list -f value -c Binary -c Host -c State -c Status)
        if ! awk '$1 == "nova-scheduler" && $4 == "up" {found=1} END {exit !found}' <<< "$compute_services"; then
          printf '%s\n' "$compute_services"
          echo "Nova scheduler is not reporting up; cannot create a Trove test instance" >&2
          exit 1
        fi
        if ! awk '$1 == "nova-compute" && $4 == "up" {found=1} END {exit !found}' <<< "$compute_services"; then
          printf '%s\n' "$compute_services"
          echo "Nova compute is not reporting up; cannot create a Trove test instance" >&2
          exit 1
        fi
        timeout "$openstack_timeout" openstack flavor show "$mongodb_flavor" >/dev/null

        network_id=$(timeout "$openstack_timeout" openstack network show demo-net -f value -c id)
        suffix=$RANDOM
        name=test-mongodb-$suffix
        timeout_seconds=600
        sleep_time=10

        delete_instance() {
          timeout "$openstack_timeout" openstack database instance delete "$name" >/dev/null 2>&1 || \
            timeout "$openstack_timeout" openstack database instance force delete "$name" >/dev/null 2>&1
        }

        cleanup() {
          set +e
          delete_instance
        }
        trap cleanup EXIT

        wait_for_healthy() {
          local started_at
          local elapsed
          local details
          local status
          local operating_status
          started_at=$(date +%s)

          while true; do
            if details=$(timeout 45 openstack database instance show "$name" -f yaml 2>/dev/null); then
              status=$(awk -F': ' '$1 == "status" {print $2}' <<< "$details")
              operating_status=$(awk -F': ' '$1 == "operating_status" {print $2}' <<< "$details")

              if [[ "$status" == "ERROR" || "$operating_status" == "ERROR" || "$operating_status" == "FAILED" ]]; then
                printf '%s\n' "$details"
                echo "MongoDB Trove instance entered an error state" >&2
                return 1
              fi

              if [[ "$status" == "ACTIVE" && "$operating_status" == "HEALTHY" ]]; then
                return 0
              fi

              echo "Trove MongoDB: status=$status operating_status=$operating_status"
            else
              echo "Trove API unavailable while waiting for MongoDB instance" >&2
            fi

            elapsed=$(( $(date +%s) - started_at ))
            if [[ $elapsed -ge $timeout_seconds ]]; then
              timeout "$openstack_timeout" openstack database instance show "$name" || true
              echo "Timed out waiting for MongoDB Trove instance to become healthy" >&2
              return 1
            fi

            sleep "$sleep_time"
          done
        }

        timeout 120 openstack database instance create "$name" \
            --flavor "$mongodb_flavor" \
            --size 5 \
            --nic net-id="$network_id" \
            --datastore mongodb \
            --datastore-version "$mongodb_version" \
            --replica-count 1 \
            --is-public \
            --allowed-cidr 0.0.0.0/0

        wait_for_healthy

        addresses=$(timeout "$openstack_timeout" openstack database instance show "$name" -f value -c ip)
        if [[ -z "$addresses" || "$addresses" == "None" ]]; then
          timeout "$openstack_timeout" openstack database instance show "$name" || true
          echo "MongoDB Trove instance did not expose an IP address" >&2
          exit 1
        fi

        check_mongodb_port() {
          local ip
          local normalized_addresses="${addresses//,/ }"

          for ip in $normalized_addresses; do
            if [[ "$ip" != "None" ]] && timeout 10 bash -c ": </dev/tcp/$ip/27017"; then
              echo "MongoDB is reachable at $ip:27017"
              return 0
            fi
          done

          echo "MongoDB was not reachable at any advertised address: $addresses" >&2
          return 1
        }

        check_mongodb_port

        timeout 120 openstack database instance restart "$name"
        wait_for_healthy
        addresses=$(timeout "$openstack_timeout" openstack database instance show "$name" -f value -c ip)
        check_mongodb_port

        trap - EXIT
        delete_instance
      args:
        chdir: "{{ playbook_dir }}/../.."
        executable: /bin/bash
