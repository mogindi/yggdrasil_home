---
- name: Prepare kolla-ansible
  hosts: deployment_controller
  any_errors_fatal: true
  tasks:
    - name: Install kolla-ansible dependencies
      script: "{{ playbook_dir }}/../scripts/kolla-ansible/deps.sh"
      args:
        chdir: "{{ playbook_dir }}/.."
 
    - name: Install kolla-ansible
      script: "{{ playbook_dir }}/../scripts/kolla-ansible/install.sh"
      args:
        chdir: "{{ playbook_dir }}/.."
      environment:
        OPENSTACK_RELEASE: "{{ openstack_release }}"

    - name: Add inventory for deployment controller
      copy: 
        dest: "{{ playbook_dir }}/../workspace/inventory/00-deployment"
        content: |
          {{ inventory_hostname }} ansible_host={{ ansible_host }} ansible_connection=local

          [deployment]
          {{ inventory_hostname }}

    - name: Add inventory for nodes
      copy: 
        dest: "{{ playbook_dir }}/../workspace/inventory/0{{ hostvars[item].inventory_index }}-{{ item }}"
        content: |
          {{ item }} ansible_host={{ hostvars[item].ansible_host }} {{ 'ansible_connection=local' if item == inventory_hostname }}

          [control]
          {{ item }}

          [network]
          {{ item }}

          [compute]
          {{ item }}

          [storage]
          {{ item }}

          [monitoring]
          {{ item }}
      loop: "{{ groups['deployment_nodes'] }}"

    - name: Stage CloudKitty metrics definition for configure script
      copy:
        src: "{{ playbook_dir }}/../scripts/kolla-ansible/cloudkitty-metrics.yml"
        dest: /tmp/yggdrasil-cloudkitty-metrics.yml
        mode: '0644'
      tags: configure

    - name: Stage Nova reader policy for configure script
      copy:
        src: "{{ playbook_dir }}/../scripts/kolla-ansible/policies/nova/policy.yaml"
        dest: /tmp/yggdrasil-nova-reader-policy.yaml
        mode: '0644'
      tags: configure

    - name: Stage Cinder reader policy for configure script
      copy:
        src: "{{ playbook_dir }}/../scripts/kolla-ansible/policies/cinder/policy.yaml"
        dest: /tmp/yggdrasil-cinder-reader-policy.yaml
        mode: '0644'
      tags: configure

    - name: Configure kolla-ansible
      script: "{{ playbook_dir }}/../scripts/kolla-ansible/configure.sh"
      args:
        chdir: "{{ playbook_dir }}/.."
      environment:
        CLOUDKITTY_METRICS_FILE: /tmp/yggdrasil-cloudkitty-metrics.yml
        OPENSTACK_NOVA_POLICY_FILE: /tmp/yggdrasil-nova-reader-policy.yaml
        OPENSTACK_CINDER_POLICY_FILE: /tmp/yggdrasil-cinder-reader-policy.yaml
        OPENSTACK_NETWORK_INTERFACE: "{{ openstack_network_interface }}"
        OPENSTACK_NEUTRON_EXTERNAL_INTERFACE: "{{ openstack_neutron_external_interface }}"
        OPENSTACK_KOLLA_INTERNAL_VIP_ADDRESS: "{{ openstack_kolla_internal_vip_address }}"
        OPENSTACK_DESIGNATE_FORWARDERS_FIRST_ADDRESS: "{{ openstack_designate_forwarders_first_address }}"
        OPENSTACK_DESIGNATE_FORWARDERS_SECOND_ADDRESS: "{{ openstack_designate_forwarders_second_address }}"
        OPENSTACK_CEPH_RGW_HOSTS: "{{ openstack_ceph_rgw_hosts }}"
        OPENSTACK_WORKER_COUNT: "{{ openstack_worker_count }}"
        OPENSTACK_NOVA_COMPUTE_MONITORS: "{{ openstack_nova_compute_monitors | default('cpu.virt_driver') }}"
        OPENSTACK_NOVA_METRICS_WEIGHT_SETTING: "{{ openstack_nova_metrics_weight_setting | default('cpu.percent=-1.0') }}"
        OPENSTACK_ZUN_KATA_ENABLED: "{{ openstack_zun_kata_enabled | default(false) }}"
        OPENSTACK_ZUN_CPU_ALLOCATION_RATIO: "{{ openstack_zun_cpu_allocation_ratio | default(8.0) }}"
        OPENSTACK_ZUN_RAM_ALLOCATION_RATIO: "{{ openstack_zun_ram_allocation_ratio | default(1.5) }}"
        OPENSTACK_ZUN_HOST_SHARED_WITH_NOVA: "{{ openstack_zun_host_shared_with_nova | default(true) }}"
        OPENSTACK_FUNCTION_CLOUDKITTY_ENABLED: "{{ function_cloudkitty_enabled | default(false) }}"
        OPENSTACK_NETWORK_GUARD_ENABLED: "{{ openstack_network_guard_enabled | default(false) | bool }}"
        OPENSTACK_AMPHORA_SUBNET_CIDR: "{{ openstack_amphora_network.cidr }}"
        OPENSTACK_PHYSNET_MTU: "{{ openstack_physnet_mtu | default(1500) }}"
        OPENSTACK_PATH_MTU: "{{ openstack_physnet_mtu | default(1500) }}"
      tags: configure

    - name: Apply inventory-defined Kolla overrides
      ansible.builtin.include_tasks:
        file: tasks/kolla_overrides.yml
        apply:
          tags:
            - configure
      vars:
        yggdrasil_kolla_config_dir: "{{ playbook_dir }}/../workspace/etc/kolla"
      tags: configure

    - name: Run kolla-ansible
      debug:
        msg: 
          - "Run kolla-ansible with:"
          - ./scripts/kolla-ansible/kolla-ansible.sh bootstrap-servers
          - ./scripts/kolla-ansible/kolla-ansible.sh prechecks
          - ./scripts/kolla-ansible/kolla-ansible.sh deploy
          - ./scripts/kolla-ansible/kolla-ansible.sh post-deploy
