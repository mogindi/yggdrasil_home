- name: Set up devices
  hosts: deployment_nodes
  any_errors_fatal: true
  tasks:
    - name: Ensure docker.io is not installed
      apt:
        name: docker.io
        state: absent
        purge: yes

    - name: Create docker directory
      command: mkdir -p /etc/docker
      args:
        creates: /etc/docker

    - name: Check if docker daemon.json exists
      stat:
        path: /etc/docker/daemon.json
      register: docker_daemon_json

    - name: Add options to docker daemon.json
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
              "bridge": "none",
              "ip-forward": false,
              "ip-forward-no-drop": true,
              "iptables": false,
              "live-restore": true,
              "log-opts": {
                  "max-file": "5",
                  "max-size": "50m"
              }
          }
      when: not docker_daemon_json.stat.exists
      register: docker_daemon_json_configured

    - name: Check for legacy unauthenticated Docker API override
      slurp:
        src: /etc/systemd/system/docker.service.d/override.conf
      register: docker_service_override
      changed_when: false
      failed_when: false

    - name: Remove legacy unauthenticated Docker API override
      file:
        path: /etc/systemd/system/docker.service.d/override.conf
        state: absent
      register: docker_legacy_api_override_removed
      when:
        - docker_service_override.content is defined
        - "'tcp://0.0.0.0:2375' in (docker_service_override.content | b64decode)"

    - name: Overwrite docker source
      vars:
        os_release: "{% if (openstack_release|string) == '2025.2' %}noble{% else %}jammy{% endif %}"
      copy:
        dest: /etc/apt/sources.list.d/docker.sources
        content: |
          # Ansible managed

          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ os_release }}
          Components: stable
          Signed-by: /etc/apt/keyrings/docker.asc

    - name: Download docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc && chmod a+r /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc

    - name: Install docker
      apt:
        package:
          - docker-ce 
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - python3-docker  # needed for kolla-ansible
        update_cache: true
        state: latest
      register: docker_installed

    - name: Ensure docker service is started and enabled
      systemd:
        name: docker
        state: restarted
        enabled: yes
        daemon_reload: yes
      when:
        - >-
          docker_installed.changed
          or docker_daemon_json_configured.changed
          or (docker_legacy_api_override_removed.changed | default(false))

    - name: Verify unauthenticated Docker API is disabled
      shell: "! ss -ltnH 'sport = :2375' | grep -q ."
      changed_when: false
